<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HUFSONLY 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + status tabs, single column of request cards (two columns on wide screens) */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --ink:#0e2341; --muted:#5d6c82; --line:#dce3ed;
  --accent:#0d3c73; --accent-soft:#e2eaf4; --teal:#0f9aa0; --ok:#14906b; --warn:#b97300; --bad:#d2483a;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121f; --surface:#102036; --ink:#e6edf7; --muted:#93a3b9; --line:#1f3350;
  --accent:#4f8fe3; --accent-soft:#16304f; --teal:#3cc3c6; --ok:#4fd19a; --warn:#f0b04a; --bad:#ff7a6b; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:20px;letter-spacing:.02em}
.logo span{color:var(--teal)}
.logo small{font-size:13px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:0}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 14px;font:600 14px var(--body);cursor:pointer;background:var(--accent);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:transparent;border:1.5px solid color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.btn.kakao{background:#FEE500;color:#191919}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tab b{font-variant-numeric:tabular-nums;font-size:12px;background:var(--bg);border-radius:999px;padding:1px 8px}
.tab[data-s="pending"] b{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.sep{width:1px;background:var(--line);margin:4px 4px}
.tab b.hot{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.wide{grid-column:1/-1}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard.done{opacity:.6}
.who2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.who2 b{font-size:15px}
.arrow{color:var(--muted)}
.quote{margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.convo{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;background:var(--bg);border-radius:12px;padding:10px}
.convo div{font-size:13.5px;overflow-wrap:anywhere}
.convo .t{color:var(--muted);font-size:11.5px;margin-left:6px}
.convo .r{color:var(--bad);font-weight:600}
textarea.field{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;min-width:0}
.shot{width:120px;height:170px;border-radius:12px;border:1px solid var(--line);background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:zoom-in;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot[disabled]{cursor:default}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head b{font-size:16px}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.check{margin:0;padding:8px 12px 8px 28px;background:var(--bg);border-radius:10px;font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:110px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 12.5px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.banwhy{margin-top:4px;padding:12px;border:1.5px dashed color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:12px}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px var(--body);padding:9px 11px}
.field:focus{outline:none;border-color:var(--accent)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.pending{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.approved{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.pill.rejected{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.empty,.gate{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted)}
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate h1{margin:0;color:var(--ink);font-size:20px}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(5,10,20,.82);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:90vh;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){.card{grid-template-columns:1fr}.shot{width:100%;height:220px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">HUFS<span>ONLY</span><small>관리자</small></div>
    <div style="display:flex;gap:8px">
      <button class="btn line" id="reload" hidden>새로고침</button>
      <button class="btn line" id="logout" hidden>로그아웃</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <h1 id="gateTitle">관리자 로그인</h1>
    <p id="gateText" style="margin:0">운영자 카카오 계정으로 로그인해 주세요.</p>
    <button class="btn kakao" id="login">카카오로 로그인</button>
  </section>

  <main id="main" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-s="pending" aria-selected="true">승인 대기 <b id="c-pending">0</b></button>
      <button class="tab" role="tab" data-s="approved" aria-selected="false">승인됨 <b id="c-approved">0</b></button>
      <button class="tab" role="tab" data-s="rejected" aria-selected="false">반려됨 <b id="c-rejected">0</b></button>
      <button class="tab" role="tab" data-s="banned" aria-selected="false">정지됨 <b id="c-banned">0</b></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="tab" role="tab" data-s="reports" aria-selected="false">신고 <b id="c-reports" class="hot">0</b></button>
      <button class="tab" role="tab" data-s="feedback" aria-selected="false">피드백 <b id="c-feedback">0</b></button>
    </div>
    <div class="grid" id="list"></div>
  </main>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="인증 캡처 크게 보기"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CFG=window.HUFS_CONFIG||{};
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const REASONS=["학번이 안 보여요","학과가 안 보여요","외대 화면이 아니에요","입력한 학과와 달라요","캡처가 흐려요"];
let rows=[],tab="pending",urls={};

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function gate(title,text,showLogin){$("#gate").hidden=false;$("#main").hidden=true;$("#gateTitle").textContent=title;$("#gateText").textContent=text;$("#login").hidden=!showLogin;}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return"방금";if(m<60)return m+"분 전";const h=Math.round(m/60);if(h<24)return h+"시간 전";return Math.round(h/24)+"일 전";};

$("#login").onclick=()=>sb.auth.signInWithOAuth({provider:"kakao",options:{redirectTo:location.origin+location.pathname}});
$("#logout").onclick=async()=>{await sb.auth.signOut();location.replace(location.pathname);};
$("#reload").onclick=load;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.s;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render();});
$("#viewer").onclick=()=>$("#viewer").hidden=true;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.includes("access_token")||location.search.includes("code="))history.replaceState(null,"",location.pathname);
  if(!session)return gate("관리자 로그인","운영자 카카오 계정으로 로그인해 주세요.",true);
  $("#logout").hidden=false;
  const {data,error}=await sb.from("admins").select("id").eq("id",session.user.id).maybeSingle();
  if(error)return gate("설정이 필요해요","admin-setup.sql을 Supabase에서 실행했는지 확인해 주세요. ("+error.message+")",false);
  if(!data)return gate("관리자가 아니에요","이 계정은 관리자 권한이 없어요. 운영자 계정으로 다시 로그인해 주세요.",false);
  $("#gate").hidden=true;$("#main").hidden=false;$("#reload").hidden=false;
  load();
}
async function load(){
  const {data,error}=await sb.from("profiles").select("*").order("updated_at",{ascending:false});
  if(error){toast("불러오지 못했어요: "+error.message);return;}
  rows=data;urls={};
  const paths=rows.filter(r=>r.verify_path).map(r=>r.verify_path);
  if(paths.length){const {data:s}=await sb.storage.from("verify").createSignedUrls(paths,3600);(s||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl;});}
  ["pending","approved","rejected","banned"].forEach(k=>$("#c-"+k).textContent=rows.filter(r=>r.status===k).length);
  await loadExtra();
  render();
}
function checks(r){
  const y=(r.year||"").replace("학번","");
  return r.verify_method==="에브리타임"
    ?["에브리타임 홈 화면이 맞는지","상단 학교명이 '한국외대'인지","편집된 흔적이 없는지"]
    :["한국외대 모바일 ID 화면이 맞는지","학번이 "+y+"로 시작하는지","학과가 '"+r.dept+"'와 같은지"];
}
function render(){
  if(tab==="reports")return renderReports();
  if(tab==="feedback")return renderFeedback();
  const list=rows.filter(r=>r.status===tab);
  if(!list.length){$("#list").innerHTML=`<div class="empty" style="grid-column:1/-1">${{pending:"승인 대기 중인 사람이 없어요.",approved:"아직 승인한 사람이 없어요.",rejected:"반려한 사람이 없어요.",banned:"정지된 사람이 없어요."}[tab]}</div>`;return;}
  $("#list").innerHTML=list.map(r=>{
    const u=r.verify_path&&urls[r.verify_path];
    const shot=u?`<button class="shot" data-view="${esc(u)}" aria-label="캡처 크게 보기"><img src="${esc(u)}" alt=""></button>`
      :`<button class="shot" disabled>${r.status==="pending"?"캡처를<br>불러오지 못했어요":"캡처는<br>삭제됐어요"}</button>`;
    let acts="";
    if(r.status==="pending"){
      acts=`${r.nick?"":`<p class="check" style="padding-left:12px;color:var(--warn)">아직 프로필을 다 만들지 않았어요. 승인은 가능해요.</p>`}
      <ul class="check">${checks(r).map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
      <div class="rejbox" data-id="${r.id}" hidden>
        <div class="reasons">${REASONS.map(x=>`<button class="chip" data-reason="${esc(x)}" aria-pressed="false">${esc(x)}</button>`).join("")}</div>
        <input class="field" placeholder="직접 입력 (선택)" aria-label="반려 사유 직접 입력" style="margin-top:8px">
        <div class="acts" style="margin-top:8px"><button class="btn line" data-cancel="${r.id}">취소</button><button class="btn bad" data-rejectgo="${r.id}">반려 보내기</button></div>
      </div>
      <div class="acts mainacts"><button class="btn bad" data-reject="${r.id}">반려</button><button class="btn ok" data-approve="${r.id}">승인하기</button></div>`;
    }else if(r.status==="approved"){
      acts=`<div class="acts"><button class="btn line" data-undo="${r.id}">승인 취소 (대기로)</button><button class="btn bad" data-ban="${r.id}">이용 정지</button></div>`;
    }else if(r.status==="banned"){
      acts=`<p class="check" style="padding-left:12px">정지 사유: ${esc(r.reject_reason||"-")}<br>기간: ${r.banned_until?new Date(r.banned_until).toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"numeric",minute:"2-digit"})+"까지"+(new Date(r.banned_until)<new Date()?" (기간 끝남 · 다음 접속 때 자동 해제)":""):"영구"}</p><div class="acts"><button class="btn line" data-unban="${r.id}">정지 해제 (승인으로)</button></div>`;
    }else{
      acts=`<p class="check" style="padding-left:12px">반려 사유: ${esc(r.reject_reason||"-")}</p>`;
    }
    return `<article class="card">${shot}<div class="info">
      <div class="head"><div><b>${esc(r.nick||"(프로필 작성 전)")}</b> <span class="pill ${r.status==="banned"?"rejected":r.status}">${{pending:"대기",approved:"승인",rejected:"반려",banned:"정지"}[r.status]}</span></div><span class="when">${ago(r.updated_at)}</span></div>
      <dl><dt>캠퍼스</dt><dd>${esc(r.campus)}</dd><dt>학과</dt><dd>${esc(r.dept)}</dd><dt>학번</dt><dd>${esc(r.year)}</dd><dt>인증 방법</dt><dd>${esc(r.verify_method||"-")}</dd>
      ${r.gender?`<dt>성별·나이</dt><dd>${r.gender==="여"?"여자":"남자"} · ${esc(r.age)}살</dd>`:""}</dl>
      ${acts}</div></article>`;
  }).join("");
}
async function setStatus(id,status,reason,btn,until){
  const r=rows.find(x=>x.id===id);if(btn){btn.disabled=true;}
  const upd={status,reject_reason:(status==="rejected"||status==="banned")?reason:null,banned_until:status==="banned"?(until||null):null};
  if(status!=="pending"&&r.verify_path)upd.verify_path=null;
  const {error}=await sb.from("profiles").update(upd).eq("id",id);
  if(error){toast("바꾸지 못했어요: "+error.message);if(btn)btn.disabled=false;return;}
  if(status!=="pending"&&r.verify_path){await sb.storage.from("verify").remove([r.verify_path]);}
  toast({approved:"승인했어요",rejected:"반려했어요. 캡처는 삭제했어요",pending:"대기로 돌렸어요",banned:"이용을 정지했어요"}[status]);
  load();
}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.view){$("#viewerImg").src=b.dataset.view;$("#viewer").hidden=false;return;}
  if(b.dataset.approve)return setStatus(b.dataset.approve,"approved",null,b);
  if(b.dataset.ban){banPicker(b,b.dataset.ban,null);return;}
  if(b.dataset.unban)return setStatus(b.dataset.unban,"approved",null,b);
  if(b.dataset.rdone)return setReport(b.dataset.rdone,{status:"done"},b);
  if(b.dataset.rban){const r=reports.find(x=>x.id==b.dataset.rban);banPicker(b,r.target,r.id);return;}
  if(b.dataset.convo)return showConvo(b.dataset.convo,b);
  if(b.dataset.fbsave)return saveReply(b.dataset.fbsave,b);
  if(b.dataset.fbhide)return hideFb(b.dataset.fbhide,b);
  if(b.dataset.undo)return setStatus(b.dataset.undo,"pending",null,b);
  const card=b.closest(".card");
  if(b.dataset.reject){card.querySelector(".rejbox").hidden=false;card.querySelector(".mainacts").hidden=true;return;}
  if(b.dataset.cancel){card.querySelector(".rejbox").hidden=true;card.querySelector(".mainacts").hidden=false;return;}
  if(b.dataset.reason){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");return;}
  if(b.dataset.rejectgo){
    const box=card.querySelector(".rejbox");
    const picked=[...box.querySelectorAll('.chip[aria-pressed="true"]')].map(x=>x.dataset.reason);
    const own=box.querySelector(".field").value.trim();if(own)picked.push(own);
    if(!picked.length){toast("반려 사유를 하나 이상 골라 주세요");return;}
    setStatus(b.dataset.rejectgo,"rejected",picked.join(", "),b);
  }
});

/* ===== 신고 · 피드백 ===== */
let reports=[],feedback=[];
const nickOf=id=>{const r=rows.find(x=>x.id===id);return r?(r.nick||"(프로필 작성 전)"):"(탈퇴한 회원)";};
function banPicker(b,target,rid){
  const box=b.closest(".info")||b.closest(".rcard")||b.parentElement;
  if(box.querySelector(".banwhy"))return;
  const f=document.createElement("div");f.className="banwhy";if(rid)f.dataset.rid=rid;
  f.innerHTML=`<div class="reasons">${[[3,"3일"],[5,"5일"],[7,"7일"],[30,"30일"],[0,"영구"]].map(([d,l])=>`<button class="chip" data-dur="${d}" aria-pressed="false">${l}</button>`).join("")}</div>
    <input class="field" style="margin-top:8px" placeholder="정지 사유 (예: 불쾌한 메시지)" aria-label="정지 사유">
    <div class="acts" style="margin-top:8px"><button class="btn line" data-bancancel="1">취소</button><button class="btn bad" data-banok="${target}">정지하기</button></div>`;
  box.appendChild(f);
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-bancancel]");if(c)c.closest(".banwhy").remove();});
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-dur]");if(d){d.parentElement.querySelectorAll("[data-dur]").forEach(x=>x.setAttribute("aria-pressed",x===d));return;}
  const b=e.target.closest("[data-banok]");if(!b)return;
  const box=b.closest(".banwhy"),why=box.querySelector("input").value.trim(),sel=box.querySelector('[data-dur][aria-pressed="true"]');
  if(!sel){toast("정지 기간을 골라 주세요");return;}
  if(!why){toast("정지 사유를 적어 주세요");return;}
  const days=+sel.dataset.dur,until=days?new Date(Date.now()+days*86400000).toISOString():null,label=days?days+"일":"영구";
  setStatus(b.dataset.banok,"banned",why,b,until);
  if(box.dataset.rid)setReport(box.dataset.rid,{status:"done",admin_note:"이용 정지 "+label+" · "+why},null);
});
async function loadExtra(){
  const [r1,r2]=await Promise.all([
    sb.from("reports").select("*").order("created_at",{ascending:false}).limit(200),
    sb.from("feedback").select("*").order("created_at",{ascending:false}).limit(200)]);
  reports=r1.data||[];feedback=r2.data||[];
  $("#c-reports").textContent=reports.filter(r=>r.status==="open").length;
  $("#c-feedback").textContent=feedback.filter(f=>!f.reply&&!f.hidden).length;
}
function renderReports(){
  if(!reports.length){$("#list").innerHTML=`<div class="empty wide">들어온 신고가 없어요.</div>`;return;}
  $("#list").innerHTML=reports.map(r=>{
    const t=rows.find(x=>x.id===r.target);
    return `<article class="rcard${r.status==="done"?" done":""}">
      <div class="head"><div class="who2"><b>${esc(nickOf(r.reporter))}</b><span class="arrow">→</span><b>${esc(nickOf(r.target))}</b>
        <span class="pill ${r.status==="open"?"rejected":"approved"}">${r.status==="open"?"처리 전":"처리됨"}</span>${t&&t.status==="banned"?`<span class="pill rejected">정지됨</span>`:""}</div><span class="when">${ago(r.created_at)}</span></div>
      <dl><dt>이유</dt><dd>${esc(r.reason)}</dd>${r.admin_note?`<dt>메모</dt><dd>${esc(r.admin_note)}</dd>`:""}</dl>
      ${r.detail?`<p class="quote">${esc(r.detail)}</p>`:""}
      <div class="convoBox" data-for="${r.id}"></div>
      <div class="acts"><button class="btn line" data-convo="${r.id}">대화 보기</button>${r.status==="open"?`<button class="btn line" data-rdone="${r.id}">처리 완료</button><button class="btn bad" data-rban="${r.id}">대상 이용 정지</button>`:""}</div>
    </article>`;}).join("");
}
async function setReport(id,upd,btn){
  if(btn)btn.disabled=true;
  const {error}=await sb.from("reports").update(upd).eq("id",id);
  if(error){toast("바꾸지 못했어요: "+error.message);if(btn)btn.disabled=false;return;}
  if(btn)toast("처리했어요");load();
}
async function showConvo(rid,btn){
  const r=reports.find(x=>x.id==rid),box=document.querySelector(`.convoBox[data-for="${rid}"]`);
  if(box.innerHTML){box.innerHTML="";return;}
  btn.disabled=true;
  const {data,error}=await sb.from("messages").select("*")
    .or(`and(sender_id.eq.${r.reporter},receiver_id.eq.${r.target}),and(sender_id.eq.${r.target},receiver_id.eq.${r.reporter})`)
    .order("created_at",{ascending:true}).limit(300);
  btn.disabled=false;
  if(error){toast("대화를 불러오지 못했어요: "+error.message);return;}
  box.innerHTML=data.length?`<div class="convo">${data.map(m=>`<div><span class="${m.sender_id===r.target?"r":""}">${esc(nickOf(m.sender_id))}</span>: ${m.body?esc(m.body):"(사진)"}<span class="t">${new Date(m.created_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></div>`).join("")}</div>`
    :`<p class="check" style="padding-left:12px">주고받은 메시지가 없어요.</p>`;
}
function renderFeedback(){
  if(!feedback.length){$("#list").innerHTML=`<div class="empty wide">들어온 피드백이 없어요.</div>`;return;}
  $("#list").innerHTML=feedback.map(f=>`<article class="rcard${f.hidden?" done":""}">
    <div class="head"><div class="who2"><b>${esc(nickOf(f.user_id))}</b>${f.hidden?`<span class="pill rejected">숨김</span>`:f.reply?`<span class="pill approved">답변함</span>`:`<span class="pill pending">답변 전</span>`}</div><span class="when">${ago(f.created_at)}</span></div>
    <p class="quote">${esc(f.body)}</p>
    <textarea class="field" id="rp-${f.id}" placeholder="운영자 답변 (모두에게 보여요)" aria-label="운영자 답변">${esc(f.reply||"")}</textarea>
    <div class="acts"><button class="btn line" data-fbhide="${f.id}">${f.hidden?"다시 보이기":"숨기기"}</button><button class="btn" data-fbsave="${f.id}">답변 저장</button></div>
  </article>`).join("");
}
async function saveReply(id,btn){
  const v=$("#rp-"+id).value.trim();btn.disabled=true;
  const {error}=await sb.from("feedback").update({reply:v||null,replied_at:v?new Date().toISOString():null}).eq("id",id);
  btn.disabled=false;toast(error?"저장하지 못했어요: "+error.message:"답변을 저장했어요");if(!error)load();
}
async function hideFb(id,btn){
  const f=feedback.find(x=>x.id==id);btn.disabled=true;
  const {error}=await sb.from("feedback").update({hidden:!f.hidden}).eq("id",id);
  btn.disabled=false;toast(error?"바꾸지 못했어요: "+error.message:f.hidden?"다시 보이게 했어요":"숨겼어요");if(!error)load();
}
boot();
</script>
</body>
</html>
