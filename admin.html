<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>유니로그 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6f3ef; --surface:#ffffff; --ink:#2a2420; --muted:#776b62; --line:#e4ddd5;
  --accent:#E35C0B; --soft:#fdeee3; --ok:#2f8a4e; --warn:#b97300; --bad:#c8382b;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171310; --surface:#221c18; --ink:#f1ebe5; --muted:#a99c91; --line:#3a312a;
  --accent:#ff7f33; --soft:#3a2416; --ok:#5fc581; --warn:#f0b04a; --bad:#ff7a6b; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px}
.logo span{color:var(--accent)}
.logo small{font-size:13px;color:var(--muted);font-weight:500;margin-left:8px}
.btn{appearance:none;border:0;border-radius:8px;padding:9px 14px;font:700 14px var(--body);cursor:pointer;background:var(--accent);color:#fff}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:transparent;border:1.5px solid color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.btn.kakao{background:#FEE500;color:#191919}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 12px;font:700 14px var(--body);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.tab b{font-variant-numeric:tabular-nums;font-size:12px;background:var(--bg);border-radius:6px;padding:1px 7px}
.tab[data-s="pending"] b,.tab[data-s="reports"] b{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.sep{width:1px;background:var(--line);margin:4px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard.done{opacity:.65}
.shot{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0;width:150px;height:200px;overflow:hidden;cursor:zoom-in;color:var(--muted);font:500 12.5px var(--body)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot[disabled]{cursor:default}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head b{font-size:16px}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.check{margin:0;padding:8px 12px 8px 28px;background:var(--bg);border-radius:8px;font-size:12.5px;color:var(--muted)}
.note{margin:0;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:12.5px;color:var(--muted)}
.quote{margin:0;padding:10px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.quote small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:110px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 10px;font:500 12.5px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.banwhy{padding:12px;border:1.5px dashed color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:8px}
.field{width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px var(--body);padding:9px 11px}
.field:focus{outline:none;border-color:var(--accent)}
.pill{font-size:12px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap}
.pill.pending{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.approved{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.pill.rejected,.pill.banned{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.pill.none{color:var(--muted);background:var(--bg)}
.pill.gray{color:var(--muted);background:var(--bg)}
.who2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search{margin:-6px 0 14px;max-width:360px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st span{font-size:12.5px;color:var(--muted);font-weight:500}
.st b{font-size:26px;line-height:1.15;font-weight:700}
.st small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.live b{color:var(--ok)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.num{font-variant-numeric:tabular-nums}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.ch-head .lg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.ch-head .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:6px}
i.v,.bar .v{background:var(--accent)} i.m,.bar .m{background:var(--ok)} i.r,.bar .r{background:#8a7cf0}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:120px;align-items:end;margin-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.bar .cols{display:flex;align-items:flex-end;gap:1px;height:92px;width:100%;justify-content:center}
.bar .cols i{display:block;width:30%;max-width:8px;border-radius:2px 2px 0 0;min-height:1px}
.bar small{font-size:10px;color:var(--muted)}
.bar.today small{color:var(--ink);font-weight:700}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sch-wrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.sch{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.sch th{text-align:right;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sch td{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.sch th:first-child,.sch td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.sch td:first-child b{display:block;font-size:13.5px}
.sch td:first-child small{color:var(--muted);font-size:11.5px}
.sch .up{color:var(--ok);font-size:11.5px;margin-left:3px}
.sch .muted{color:var(--muted);text-align:left}
.empty,.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate h1{margin:0;color:var(--ink);font-size:20px}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(10,6,4,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:90vh;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (max-width:460px){.card{grid-template-columns:1fr}.shot{width:100%;height:240px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">유니<span>로그</span><small>관리자</small></div>
    <div style="display:flex;gap:8px">
      <button class="btn line" id="reload" hidden>새로고침</button>
      <button class="btn line" id="logout" hidden>로그아웃</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <h1 id="gateTitle">관리자 로그인</h1>
    <p id="gateText" style="margin:0">운영자 카카오 계정으로 로그인해 주세요.</p>
    <button class="btn kakao" id="login">카카오로 로그인</button>
  </section>

  <main id="main" hidden>
    <section class="stats" aria-label="통계">
      <div class="st live"><span>지금 접속 중</span><b id="s-live" class="num">-</b><small><i class="dot"></i><span id="s-live2">불러오는 중…</span></small></div>
      <div class="st"><span>오늘 방문자</span><b id="s-today" class="num">-</b><small id="s-today2">&nbsp;</small></div>
      <div class="st"><span>누적 방문자</span><b id="s-total" class="num">-</b><small id="s-total2">&nbsp;</small></div>
      <div class="st"><span>가입자</span><b id="s-mem" class="num">-</b><small id="s-mem2">&nbsp;</small></div>
    </section>
    <section class="chart" aria-label="최근 14일">
      <div class="ch-head"><b>최근 14일</b><span class="lg"><i class="v"></i>방문자 <i class="m"></i>가입자 <i class="r"></i>리뷰</span></div>
      <div class="bars" id="bars"></div>
      <p class="note" id="statNote" style="margin-top:10px">통계를 불러오는 중…</p>
    </section>
    <section class="chart" aria-label="학교별 현황">
      <div class="ch-head"><b>학교별 현황</b><span class="lg">최근 7일 늘어난 수는 +로 표시</span></div>
      <div class="sch-wrap"><table class="sch"><thead><tr><th>학교</th><th>가입자</th><th>인증</th><th>리뷰</th><th>로그톡</th><th>댓글</th><th>최근 활동</th></tr></thead><tbody id="schBody"><tr><td colspan="7" class="muted">불러오는 중…</td></tr></tbody></table></div>
      <button class="btn line" type="button" id="schMore" hidden style="margin-top:10px;width:100%">전체 학교 보기</button>
      <p class="note" style="margin-top:10px">학교별 리뷰·로그톡 내용은 유니로그 앱의 "다른 학교 보기"에서 직접 볼 수 있어요. 리뷰는 쓴 사람의 학교 기준으로 세요.</p>
    </section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-s="pending" aria-selected="true">인증 대기 <b id="c-pending">0</b></button>
      <button class="tab" role="tab" data-s="approved" aria-selected="false">승인됨 <b id="c-approved">0</b></button>
      <button class="tab" role="tab" data-s="rejected" aria-selected="false">반려됨 <b id="c-rejected">0</b></button>
      <button class="tab" role="tab" data-s="none" aria-selected="false">미인증 <b id="c-none">0</b></button>
      <button class="tab" role="tab" data-s="banned" aria-selected="false">정지됨 <b id="c-banned">0</b></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="tab" role="tab" data-s="reports" aria-selected="false">신고 <b id="c-reports">0</b></button>
    </div>
    <input class="field search" id="search" placeholder="닉네임·학교로 찾기" aria-label="회원 찾기" hidden>
    <div class="grid" id="list"></div>
  </main>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="인증 캡처 크게 보기"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CFG=window.UNILOG_CONFIG||{};
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const REASONS=["학교 이름이 안 보여요","학번이 안 보여요","입력한 학교와 달라요","입력한 학번과 달라요","재학생 화면이 아니에요","캡처가 흐려요"];
const TYPE={review:"리뷰",post:"로그톡 글",comment:"댓글"};
const METHOD={id:"모바일 학생증",eta:"에브리타임 홈 화면"};
const mName=m=>METHOD[m]||m||"-";
let rows=[],priv={},urls={},reports=[],targets={},tab="pending",q="";

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function gate(title,text,showLogin){$("#gate").hidden=false;$("#main").hidden=true;$("#gateTitle").textContent=title;$("#gateText").textContent=text;$("#login").hidden=!showLogin;}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return"방금";if(m<60)return m+"분 전";const h=Math.round(m/60);if(h<24)return h+"시간 전";return Math.round(h/24)+"일 전";};
const fmt=t=>new Date(t).toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"numeric",minute:"2-digit"});

$("#login").onclick=()=>sb.auth.signInWithOAuth({provider:"kakao",options:{redirectTo:location.origin+location.pathname}});
$("#logout").onclick=async()=>{await sb.auth.signOut();location.replace(location.pathname);};
$("#reload").onclick=()=>load();
$("#search").oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.s;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render();});
$("#viewer").onclick=()=>$("#viewer").hidden=true;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.includes("access_token")||location.search.includes("code="))history.replaceState(null,"",location.pathname);
  if(!session)return gate("관리자 로그인","운영자 카카오 계정으로 로그인해 주세요.",true);
  $("#logout").hidden=false;
  const {data,error}=await sb.from("admins").select("id").eq("id",session.user.id).maybeSingle();
  if(error)return gate("설정이 필요해요","1_unilog_schema.sql을 Supabase에서 실행했는지 확인해 주세요. ("+error.message+")",false);
  if(!data)return gate("관리자가 아니에요","이 계정은 관리자 권한이 없어요. 운영자 계정으로 다시 로그인해 주세요.",false);
  $("#gate").hidden=true;$("#main").hidden=false;$("#reload").hidden=false;
  load();watchLive();setInterval(()=>{if(!document.hidden){loadStats();loadSchools();}},60000);
}

/* ===== 통계 ===== */
let schools=[],schAll=false;
async function loadSchools(){
  const {data,error}=await sb.rpc("ul_admin_schools");
  if(error){$("#schBody").innerHTML=`<tr><td colspan="7" class="muted">${/ul_admin_schools|function/.test(error.message)?"5_admin_schools.sql을 Supabase에서 실행하면 학교별 현황이 보여요.":"불러오지 못했어요: "+esc(error.message)}</td></tr>`;return;}
  schools=data||[];renderSchools();
}
function renderSchools(){
  if(!schools.length){$("#schBody").innerHTML=`<tr><td colspan="7" class="muted">아직 가입한 학교가 없어요.</td></tr>`;$("#schMore").hidden=true;return;}
  const up=n=>n?`<span class="up">+${nf(n)}</span>`:"";
  const L=schAll?schools:schools.slice(0,10);
  $("#schBody").innerHTML=L.map(s=>`<tr><td><b>${esc(s.school_short)}</b><small>${esc(s.campus||s.school_name)}</small></td>
    <td>${nf(s.members)}${up(s.members_7d)}</td><td>${nf(s.verified)}</td><td>${nf(s.reviews)}${up(s.reviews_7d)}</td>
    <td>${nf(s.posts)}${up(s.posts_7d)}</td><td>${nf(s.comments)}</td><td>${s.last_activity?ago(s.last_activity):"-"}</td></tr>`).join("");
  $("#schMore").hidden=schools.length<=10;$("#schMore").textContent=schAll?"접기":`전체 학교 보기 (${schools.length}곳)`;
}
$("#schMore").onclick=()=>{schAll=!schAll;renderSchools();};
function watchLive(){
  const tick=async()=>{
    const {data,error}=await sb.rpc("ul_admin_online");
    if(error){$("#s-live").textContent="?";$("#s-live2").textContent=/ul_admin_online|function/.test(error.message)?"6_online_now.sql 실행 필요":"불러오지 못했어요";return;}
    $("#s-live").textContent=nf(data.online);$("#s-live2").textContent="로그인 "+nf(data.members)+"명 · 최근 2분";
  };
  tick();setInterval(()=>{if(!document.hidden)tick();},20000);
}
const nf=n=>Number(n||0).toLocaleString("ko-KR");
async function loadStats(){
  const {data:s,error}=await sb.rpc("ul_admin_stats");
  if(error){$("#statNote").textContent=/ul_admin_stats|function/.test(error.message)?"4_admin_stats.sql을 Supabase에서 실행하면 통계가 보여요.":"통계를 불러오지 못했어요: "+error.message;return;}
  $("#s-today").textContent=nf(s.visitors_today);
  $("#s-today2").textContent="오늘 새 가입 +"+nf(s.members_today);
  $("#s-total").textContent=nf(s.visitors_total);
  $("#s-total2").textContent="방문 횟수 "+nf(s.visits_total)+"회";
  $("#s-mem").textContent=nf(s.members);
  $("#s-mem2").textContent="인증 "+nf(s.verified)+" · 미인증 "+nf(s.unverified)+(s.pending?" · 대기 "+nf(s.pending):"");
  const D=s.days||[],max=Math.max(1,...D.map(d=>Math.max(d.v,d.m,d.r)));
  const today=D.length?D[D.length-1].d:"";
  $("#bars").innerHTML=D.map((d,i)=>{const h=n=>Math.round(n/max*92);const dd=+d.d.slice(8),md=(i===0||dd===1)?(+d.d.slice(5,7))+"/"+dd:String(dd);
    return `<div class="bar${d.d===today?" today":""}" title="${d.d} · 방문자 ${d.v} · 가입 ${d.m} · 리뷰 ${d.r}"><div class="cols"><i class="v" style="height:${h(d.v)}px"></i><i class="m" style="height:${h(d.m)}px"></i><i class="r" style="height:${h(d.r)}px"></i></div><small>${md}</small></div>`;}).join("");
  $("#statNote").textContent=`리뷰 ${nf(s.reviews)}개 (오늘 +${nf(s.reviews_today)}) · 로그톡 글 ${nf(s.posts)}개 · 방문자는 기기 기준이라 한 사람이 폰과 PC로 들어오면 2명으로 세요.`;
}

async function load(){
  const [p1,p2,p3]=await Promise.all([
    sb.from("ul_profiles").select("*").order("updated_at",{ascending:false}).limit(2000),
    sb.from("ul_private").select("*").limit(2000),
    sb.from("ul_reports").select("*").order("created_at",{ascending:false}).limit(300)]);
  if(p1.error){toast("불러오지 못했어요: "+p1.error.message);return;}
  rows=p1.data||[];priv={};(p2.data||[]).forEach(x=>priv[x.id]=x);reports=p3.data||[];
  urls={};
  const paths=Object.values(priv).filter(x=>x.verify_path).map(x=>x.verify_path);
  if(paths.length){const {data:s}=await sb.storage.from("verify").createSignedUrls(paths,3600);(s||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl;});}
  loadStats();loadSchools();
  await loadTargets();
  ["pending","approved","rejected","none","banned"].forEach(k=>$("#c-"+k).textContent=rows.filter(r=>r.status===k).length);
  $("#c-reports").textContent=new Set(reports.filter(r=>r.status==="open").map(r=>r.target_type+r.target_id)).size;
  render();
}

async function loadTargets(){
  targets={};
  const ids=t=>[...new Set(reports.filter(r=>r.target_type===t).map(r=>r.target_id))];
  const [rv,ps,cm]=await Promise.all([
    ids("review").length?sb.from("ul_reviews").select("id,user_id,place_id,rating,body,hidden,created_at").in("id",ids("review")):{data:[]},
    ids("post").length?sb.from("ul_posts").select("id,user_id,title,body,hidden,created_at").in("id",ids("post")):{data:[]},
    ids("comment").length?sb.from("ul_comments").select("id,user_id,post_id,body,hidden,created_at").in("id",ids("comment")):{data:[]}]);
  (rv.data||[]).forEach(x=>targets["review"+x.id]=x);
  (ps.data||[]).forEach(x=>targets["post"+x.id]=x);
  (cm.data||[]).forEach(x=>targets["comment"+x.id]=x);
  const pids=[...new Set((rv.data||[]).map(x=>x.place_id))];
  if(pids.length){const {data}=await sb.from("ul_places").select("id,name").in("id",pids);const m={};(data||[]).forEach(x=>m[x.id]=x.name);(rv.data||[]).forEach(x=>x.place_name=m[x.place_id]);}
}

const prof=id=>rows.find(x=>x.id===id);
const nickOf=id=>{const r=prof(id);return r?(r.nick||"(닉네임 없음)"):"(탈퇴한 회원)";};
const whoLine=r=>`${esc(r.school_short||r.school_name)} ${esc(r.year)}`;

function checks(r,p){
  const y=String(r.year||"").replace("학번","");
  const m=(p&&p.verify_method)||"";
  if(m==="eta")return [
    "에브리타임 홈 화면이 맞는지",
    `상단 학교 이름이 '${r.school_name}${r.campus?" "+r.campus:""}'인지`,
    "편집하거나 남의 화면을 가져온 흔적이 없는지",
    `학번(${y})·학과는 캡처로 확인이 어려워요. 본인 입력값이에요`];
  return [
    "모바일 학생증 화면이 맞는지",
    `학교 이름이 '${r.school_name}${r.campus?" "+r.campus:""}'인지`,
    `학번이 ${y}로 시작하는지`,
    `학과가 '${(p&&p.dept)||"-"}'와 같은지`,
    "편집하거나 남의 화면을 가져온 흔적이 없는지"];
}

function render(){
  $("#search").hidden=tab==="reports";
  if(tab==="reports")return renderReports();
  let list=rows.filter(r=>r.status===tab);
  if(q)list=list.filter(r=>[r.nick,r.school_name,r.school_short,r.year].join(" ").toLowerCase().includes(q));
  if(tab==="pending")list.sort((a,b)=>new Date(a.updated_at)-new Date(b.updated_at)); // 오래 기다린 사람 먼저
  if(!list.length){$("#list").innerHTML=`<div class="empty">${q?"찾는 회원이 없어요.":{pending:"인증을 기다리는 사람이 없어요.",approved:"아직 승인한 사람이 없어요.",rejected:"반려한 사람이 없어요.",none:"인증 없이 가입한 사람이 없어요.",banned:"정지된 사람이 없어요."}[tab]}</div>`;return;}
  $("#list").innerHTML=list.map(r=>{
    const p=priv[r.id]||{};
    const u=p.verify_path&&urls[p.verify_path];
    const shot=u?`<button class="shot" data-view="${esc(u)}" aria-label="캡처 크게 보기"><img src="${esc(u)}" alt=""></button>`
      :`<button class="shot" disabled>${r.status==="pending"?"캡처를<br>불러오지 못했어요":"캡처는<br>삭제됐어요"}</button>`;
    let acts="";
    if(r.status==="pending"){
      acts=`<ul class="check">${checks(r,p).map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
      <div class="rejbox" hidden>
        <div class="reasons">${REASONS.map(x=>`<button class="chip" data-reason="${esc(x)}" aria-pressed="false">${esc(x)}</button>`).join("")}</div>
        <input class="field" placeholder="직접 입력 (선택)" aria-label="반려 사유 직접 입력" style="margin-top:8px">
        <div class="acts" style="margin-top:8px"><button class="btn line" data-cancel="1">취소</button><button class="btn bad" data-rejectgo="${r.id}">반려 보내기</button></div>
      </div>
      <div class="acts mainacts"><button class="btn bad" data-reject="1">반려</button><button class="btn ok" data-approve="${r.id}">승인하기</button></div>`;
    }else if(r.status==="approved"||r.status==="none"){
      acts=`<div class="acts">${r.status==="approved"?`<button class="btn line" data-unverify="${r.id}">인증 취소</button>`:""}<button class="btn bad" data-ban="${r.id}">이용 정지</button></div>`;
    }else if(r.status==="banned"){
      acts=`<p class="note">정지 사유: ${esc(r.reject_reason||"-")}<br>기간: ${r.banned_until?fmt(r.banned_until)+"까지"+(new Date(r.banned_until)<new Date()?" (기간 끝남 · 다음 접속 때 자동 해제)":""):"영구"}</p><div class="acts"><button class="btn line" data-unban="${r.id}">정지 해제</button></div>`;
    }else{
      acts=`<p class="note">반려 사유: ${esc(r.reject_reason||"-")}<br>다시 인증을 올리면 인증 대기로 돌아와요.</p>`;
    }
    return `<article class="card">${shot}<div class="info">
      <div class="head"><div><b>${esc(r.nick||"(닉네임 없음)")}</b> <span class="pill ${r.status}">${{pending:"대기",approved:"승인",rejected:"반려",none:"미인증",banned:"정지"}[r.status]}</span></div><span class="when">${ago(r.updated_at)}</span></div>
      <dl><dt>학교</dt><dd>${esc(r.school_name)}${r.campus?" · "+esc(r.campus):""}</dd>
      <dt>학번</dt><dd>${esc(r.year)}</dd>
      <dt>학과</dt><dd>${esc(p.dept||"-")}${p.dept_field?` <span style="color:var(--muted)">(${esc(p.dept_field)})</span>`:""}</dd>
      <dt>인증 방법</dt><dd>${esc(mName(p.verify_method))}</dd>
      ${r.status!=="pending"?`<dt>도움돼요</dt><dd>${r.helpful||0}</dd>`:""}
      <dt>가입</dt><dd>${fmt(r.created_at)}</dd></dl>
      ${acts}</div></article>`;
  }).join("");
}

async function setStatus(id,status,reason,btn,until){
  const p=priv[id]||{};if(btn)btn.disabled=true;
  const upd={status,reject_reason:(status==="rejected"||status==="banned")?reason:null,banned_until:status==="banned"?(until||null):null};
  const {error}=await sb.from("ul_profiles").update(upd).eq("id",id);
  if(error){toast("바꾸지 못했어요: "+error.message);if(btn)btn.disabled=false;return false;}
  // 승인·반려가 끝나면 인증 캡처는 바로 지워요 (개인정보 보관 최소화)
  if((status==="approved"||status==="rejected")&&p.verify_path){
    await sb.storage.from("verify").remove([p.verify_path]);
    await sb.from("ul_private").update({verify_path:null}).eq("id",id);
  }
  toast({approved:"승인했어요",rejected:"반려했어요. 캡처는 삭제했어요",pending:"대기로 돌렸어요",none:"미인증 상태로 바꿨어요",banned:"이용을 정지했어요"}[status]);
  load();return true;
}

function banPicker(b,target,rkey){
  const box=b.closest(".info")||b.closest(".rcard");
  if(box.querySelector(".banwhy"))return;
  const f=document.createElement("div");f.className="banwhy";if(rkey)f.dataset.rkey=rkey;
  f.innerHTML=`<div class="reasons">${[[3,"3일"],[7,"7일"],[30,"30일"],[0,"영구"]].map(([d,l])=>`<button class="chip" data-dur="${d}" aria-pressed="false">${l}</button>`).join("")}</div>
    <input class="field" style="margin-top:8px" placeholder="정지 사유 (예: 광고 리뷰 반복)" aria-label="정지 사유">
    <div class="acts" style="margin-top:8px"><button class="btn line" data-bancancel="1">취소</button><button class="btn bad" data-banok="${target}">정지하기</button></div>`;
  box.appendChild(f);
}

/* ===== 신고 (같은 대상은 하나로 묶어서) ===== */
function groups(){
  const g={};
  reports.forEach(r=>{const k=r.target_type+r.target_id;(g[k]=g[k]||{key:k,type:r.target_type,id:r.target_id,list:[]}).list.push(r);});
  return Object.values(g).map(x=>({...x,open:x.list.some(r=>r.status==="open"),last:x.list[0].created_at}))
    .sort((a,b)=>(b.open-a.open)||(new Date(b.last)-new Date(a.last)));
}
function renderReports(){
  const gs=groups();
  if(!gs.length){$("#list").innerHTML=`<div class="empty">들어온 신고가 없어요.</div>`;return;}
  $("#list").innerHTML=gs.map(g=>{
    const t=targets[g.key],author=t&&prof(t.user_id);
    const reasons={};g.list.forEach(r=>reasons[r.reason]=(reasons[r.reason]||0)+1);
    const note=g.list.find(r=>r.admin_note);
    let body=`<p class="note">이미 삭제된 ${TYPE[g.type]}이에요.</p>`;
    if(t){
      const head=g.type==="review"?`${esc(t.place_name||"가게")} · ★${t.rating}`:g.type==="post"?esc(t.title):"댓글";
      body=`<div class="quote"><small>${head} · ${esc(author?author.nick:"(탈퇴한 회원)")}${author?" · "+whoLine(author):""} · ${ago(t.created_at)}</small>${esc(t.body)}</div>`;
    }
    return `<article class="rcard${g.open?"":" done"}" data-key="${g.key}">
      <div class="head"><div class="who2"><b>${TYPE[g.type]}</b><span class="pill ${g.open?"rejected":"approved"}">${g.open?"처리 전":"처리됨"}</span>
        ${t&&t.hidden?`<span class="pill gray">가려짐</span>`:""}${author&&author.status==="banned"?`<span class="pill banned">작성자 정지됨</span>`:""}</div>
        <span class="when">${g.list.length}명 신고 · ${ago(g.last)}</span></div>
      ${body}
      <dl><dt>이유</dt><dd>${Object.entries(reasons).map(([k,n])=>esc(k)+(n>1?" ×"+n:"")).join(", ")}</dd>
      <dt>신고한 사람</dt><dd>${g.list.map(r=>esc(nickOf(r.reporter))).join(", ")}</dd>
      ${note?`<dt>메모</dt><dd>${esc(note.admin_note)}</dd>`:""}</dl>
      <div class="acts">
        ${t?`<button class="btn line" data-hide="${g.key}">${t.hidden?"다시 보이기":"가리기"}</button>`:""}
        ${g.open?`<button class="btn line" data-rdone="${g.key}">문제없음 · 처리 완료</button>`:""}
        ${t&&author&&author.status!=="banned"?`<button class="btn bad" data-rban="${g.key}">작성자 이용 정지</button>`:""}
      </div>
    </article>`;}).join("");
}
async function closeReports(key,note){
  const g=groups().find(x=>x.key===key);if(!g)return;
  const ids=g.list.filter(r=>r.status==="open").map(r=>r.id);
  if(!ids.length)return true;
  const upd={status:"done"};if(note)upd.admin_note=note;
  const {error}=await sb.from("ul_reports").update(upd).in("id",ids);
  if(error){toast("바꾸지 못했어요: "+error.message);return false;}
  return true;
}
async function toggleHide(key,btn){
  const g=groups().find(x=>x.key===key),t=targets[key];btn.disabled=true;
  const {error}=await sb.rpc("ul_set_hidden",{p_type:g.type,p_id:g.id,p_hidden:!t.hidden});
  if(error){toast("바꾸지 못했어요: "+error.message);btn.disabled=false;return;}
  if(!t.hidden)await closeReports(key,"가림 처리");
  toast(t.hidden?"다시 보이게 했어요":"가렸어요. 신고도 처리 완료로 바꿨어요");load();
}

/* ===== 클릭 처리 ===== */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.view){$("#viewerImg").src=b.dataset.view;$("#viewer").hidden=false;return;}
  if(b.dataset.approve)return setStatus(b.dataset.approve,"approved",null,b);
  if(b.dataset.unverify)return setStatus(b.dataset.unverify,"none",null,b);
  if(b.dataset.unban){const r=prof(b.dataset.unban);return setStatus(b.dataset.unban,r&&r.verified?"approved":"none",null,b);}
  if(b.dataset.ban)return banPicker(b,b.dataset.ban,null);
  if(b.dataset.hide)return toggleHide(b.dataset.hide,b);
  if(b.dataset.rdone){b.disabled=true;if(await closeReports(b.dataset.rdone,"문제없음")){toast("처리 완료로 바꿨어요");load();}else b.disabled=false;return;}
  if(b.dataset.rban){const t=targets[b.dataset.rban];if(t)banPicker(b,t.user_id,b.dataset.rban);return;}
  if(b.dataset.bancancel){b.closest(".banwhy").remove();return;}
  if(b.dataset.dur!==undefined){b.parentElement.querySelectorAll("[data-dur]").forEach(x=>x.setAttribute("aria-pressed",x===b));return;}
  if(b.dataset.banok){
    const box=b.closest(".banwhy"),why=box.querySelector("input").value.trim(),sel=box.querySelector('[data-dur][aria-pressed="true"]');
    if(!sel){toast("정지 기간을 골라 주세요");return;}
    if(!why){toast("정지 사유를 적어 주세요");return;}
    const days=+sel.dataset.dur,until=days?new Date(Date.now()+days*86400000).toISOString():null;
    if(box.dataset.rkey)await closeReports(box.dataset.rkey,"작성자 이용 정지 "+(days?days+"일":"영구")+" · "+why);
    setStatus(b.dataset.banok,"banned",why,b,until);return;
  }
  const card=b.closest(".card");if(!card)return;
  if(b.dataset.reject){card.querySelector(".rejbox").hidden=false;card.querySelector(".mainacts").hidden=true;return;}
  if(b.dataset.cancel){card.querySelector(".rejbox").hidden=true;card.querySelector(".mainacts").hidden=false;return;}
  if(b.dataset.reason){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");return;}
  if(b.dataset.rejectgo){
    const box=card.querySelector(".rejbox");
    const picked=[...box.querySelectorAll('.chip[aria-pressed="true"]')].map(x=>x.dataset.reason);
    const own=box.querySelector(".field").value.trim();if(own)picked.push(own);
    if(!picked.length){toast("반려 사유를 하나 이상 골라 주세요");return;}
    setStatus(b.dataset.rejectgo,"rejected",picked.join(", "),b);
  }
});
boot();
</script>
</body>
