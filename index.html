<style>
/* Layout: 맛집 가이드형 — 흰 헤더 + 지역 탭, 회색 바탕 위 흰 패널, 썸네일+별점+예산이 붙은 촘촘한 가게 행, 가게 상세는 탭(정보·리뷰)이 있는 전체 시트 */
:root{
  --page:#F2F2F2; --panel:#FFFFFF; --sunk:#F5F5F5; --ink:#333333; --sub:#777777; --line:#E3E3E3;
  --accent:#E35C0B; --star:#F39800; --star-off:#DDDDDD; --link:#2A5DB0;
  --badge:#E35C0B; --on-badge:#FFFFFF; --soft:#FFF3E8; --green:#2E8B57; --green-soft:#E6F4EC;
  --lv0:#EFEFEF; --lv0t:#777777; --lv1:#E6F4EC; --lv1t:#2E8B57; --lv2:#F3E8FC; --lv2t:#7B3FB8; --lv3:#FFF0DC; --lv3t:#B85A00;
  --map-road:#FFFFFF; --map-ground:#ECEBE6; --map-campus:#DCE6D3; --map-water:#CFE0F0;
  --cert:#2563EB; --cert-soft:#E5EEFF; --dlv:#BE185D; --dlv-soft:#FCE7F3;
  --f-round:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#121212; --panel:#1D1D1D; --sunk:#262626; --ink:#E8E8E8; --sub:#9E9E9E; --line:#333333;
  --accent:#FF8A3D; --star:#FFAE2E; --star-off:#444444; --link:#8DB4FF;
  --badge:#FF7A2B; --on-badge:#1A0E00; --soft:#3A2414; --green:#5FCB8F; --green-soft:#16301F;
  --lv0:#2A2A2A; --lv0t:#A8A8A8; --lv1:#16301F; --lv1t:#5FCB8F; --lv2:#2E1F42; --lv2t:#CDA6F7; --lv3:#3A2414; --lv3t:#FFAE5E;
  --map-road:#3A3A3A; --map-ground:#232323; --map-campus:#26301F; --map-water:#1C2B3A; --cert:#8AB4FF; --cert-soft:#1B2A4A; --dlv:#F58BC2; --dlv-soft:#3A1A2C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#121212; --panel:#1D1D1D; --sunk:#262626; --ink:#E8E8E8; --sub:#9E9E9E; --line:#333333;
  --accent:#FF8A3D; --star:#FFAE2E; --star-off:#444444; --link:#8DB4FF;
  --badge:#FF7A2B; --on-badge:#1A0E00; --soft:#3A2414; --green:#5FCB8F; --green-soft:#16301F;
  --lv0:#2A2A2A; --lv0t:#A8A8A8; --lv1:#16301F; --lv1t:#5FCB8F; --lv2:#2E1F42; --lv2t:#CDA6F7; --lv3:#3A2414; --lv3t:#FFAE5E;
  --map-road:#3A3A3A; --map-ground:#232323; --map-campus:#26301F; --map-water:#1C2B3A; --cert:#8AB4FF; --cert-soft:#1B2A4A; --dlv:#F58BC2; --dlv-soft:#3A1A2C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--page)}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:6px;background:var(--sunk);font-size:11.5px;color:var(--sub)}
.demo-bar button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:11.5px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.logo{font-family:var(--f-round);font-weight:400;font-size:23px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:5px}
.logo .mk{width:26px;height:26px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:0 12px;min-width:0}
.search svg{color:var(--sub);flex:none}
.search input{border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--ink);padding:7px 0;width:100%;min-width:0}
.search input:focus{outline:none}
.area-tabs{display:flex;gap:0;border-top:1px solid var(--line)}
.area-tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:13.5px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.area-tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{flex:1;padding-block:10px 84px;display:flex;flex-direction:column;gap:10px}
.view{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border-radius:10px;margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));overflow:hidden;border:1px solid var(--line)}
.panel.gut{padding-left:16px;padding-right:16px}
.panel>.gut{padding-left:16px;padding-right:16px}

/* filter bar */
.fbar{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.genre{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.genre::-webkit-scrollbar{display:none}
.genre button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 13px;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.maptoggle[aria-pressed="true"]{background:var(--accent);color:#fff}
.genre button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--soft)}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.fmeta b{color:var(--ink)}
.sort{display:flex;gap:12px}
.sort button{border:0;background:none;padding:0;font-size:13px;color:var(--sub)}
.sort button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.maptoggle{border:1.5px solid var(--accent);background:var(--panel);border-radius:6px;padding:4px 13px;font-size:13px;font-weight:700;display:inline-flex;gap:5px;align-items:center;color:var(--accent)}

.map{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--map-ground);border-bottom:1px solid var(--line)}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center}
.pin .bub{background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin .tip{width:0;height:0;border:5px solid transparent;border-top-color:var(--accent)}
.me-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#2F7BFF;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgba(47,123,255,.22)}
.map-label{position:absolute;font-size:10.5px;font-weight:700;color:var(--sub)}

/* restaurant rows */
.rs{display:grid;grid-template-columns:88px 1fr;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding-block:18px}
.rs:first-child{border-top:0}
.rs .top{display:flex;align-items:center;gap:6px;min-width:0}
.rank{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:3px;padding:0 6px;line-height:19px;flex:none}
.rank.low{background:var(--sunk);color:var(--sub)}
.rs .nm{font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .area{font-size:13px;color:var(--sub)}
.thumb{width:88px;height:88px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(0,0,0,.35);position:relative;overflow:hidden}
.thumb small{position:absolute;right:4px;bottom:3px;font-size:10px;font-weight:500;opacity:.8}
.rs .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.rating{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stars{display:inline-flex;gap:1px}
.stars i{width:13px;height:13px;display:block;background:var(--star-off);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--star)}
.stars i.half{background:linear-gradient(90deg,var(--star) 50%,var(--star-off) 50%)}
.val{font-size:19px;font-weight:900;color:var(--accent);letter-spacing:-.02em;line-height:1}
.rcount{font-size:12px;color:var(--sub);display:inline-flex;align-items:center;gap:3px}
.budget{display:flex;gap:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.budget span{display:inline-flex;align-items:center;gap:3px}
.budget svg{flex:none}
.snip{font-size:13.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.tagline{display:flex;gap:4px;flex-wrap:wrap}
.tagline span{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:2px;padding:0 4px}
.empty{padding:28px 12px;text-align:center;color:var(--sub);font-size:13.5px}

.lv{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;border-radius:6px;padding:0 7px;white-space:nowrap;line-height:17px}
.lv.l0{background:var(--lv0);color:var(--lv0t)} .lv.l1{background:var(--lv1);color:var(--lv1t)}
.lv.l2{background:var(--lv2);color:var(--lv2t)} .lv.l3{background:var(--lv3);color:var(--lv3t)}

/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-block:12px 4px;flex-wrap:wrap}
.sh h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.2}
.sh h2::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--accent);flex:none}
.sh small{font-size:12px;color:var(--sub)}

/* reviewers */
.explain{padding-block:12px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--sub)}
.explain b{color:var(--ink)}
.tiers{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tiers th,.tiers td{border:0;border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
.tiers tr:last-child>*{border-bottom:0}
.tiers th{background:var(--sunk);font-weight:500;color:var(--sub)}
.row2{display:grid;grid-template-columns:26px 40px 1fr auto;gap:10px;align-items:center;padding-block:10px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row2:first-child{border-top:0}
.row2 .n{font-weight:900;text-align:center;color:var(--sub)}
.row2 .n.top{color:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:var(--sub);font-size:14px}
.row2 .who{min-width:0}
.row2 .who b{font-size:14px;margin-right:4px}
.row2 .who span.d{display:block;font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2 .v{text-align:right;font-weight:700}
.row2 .v small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row2.is-me{background:var(--soft)}

/* me */
.prof{padding-block:16px;display:flex;flex-direction:column;gap:12px}
.prof .hd{display:flex;align-items:center;gap:12px}
.prof .hd .av{width:56px;height:56px;font-size:18px;background:var(--accent);color:#fff}
.prof .hd b{font-size:17px;margin-right:6px}
.prof .hd span.d{display:block;font-size:12.5px;color:var(--sub)}
.gauge .lbl{display:flex;justify-content:space-between;font-size:12.5px;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.gauge .lbl span{color:var(--sub)}
.bar{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv div{padding:8px;text-align:center;border-left:1px solid var(--line)}
.kv div:first-child{border-left:0}
.kv b{display:block;font-size:17px;font-weight:900}
.kv span{font-size:11.5px;color:var(--sub)}
.noti{padding-block:10px;border-top:1px solid var(--line);font-size:13px}
.noti:first-child{border-top:0}
.noti p{margin:0} .noti time{font-size:11.5px;color:var(--sub)}
.noti.n-up p::before{content:"● ";color:var(--green)} .noti.n-like p::before{content:"● ";color:var(--accent)} .noti.n-info p::before{content:"● ";color:var(--sub)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.tabs button{border:0;background:transparent;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--sub)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--page);width:100%;max-width:520px;height:94%;border-radius:14px 14px 0 0;overflow-y:auto;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.dhead{background:var(--panel);border-radius:14px 14px 0 0;padding-block:12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.dhead .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h3{margin:0;font-size:19px;line-height:1.3}
.dhead .area{font-size:12px;color:var(--sub)}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;flex:none;font-size:16px;line-height:1}
.dhead .rating{margin-top:6px}
.dhead .rating .val{font-size:24px}
.dtabs{display:flex;margin-top:10px}
.dtabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:13.5px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.dtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dbody{display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}
.hero{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:170px}
.hero .thumb{width:100%;height:100%;border-radius:0}
.hero .thumb:first-child{grid-row:span 2}
.compare{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:8px;padding:8px 10px;margin-block:10px}
.compare b{color:var(--accent)}
table.facts{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.facts th{width:84px;text-align:left;font-weight:500;color:var(--sub);background:var(--sunk);padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.facts td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.facts tr:last-child>*{border-bottom:0}
.regular{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);padding-block:10px}
.regular svg{color:var(--star);flex:none}
.regular b{color:var(--ink)}
.cta{display:flex;gap:8px;padding-block:12px}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;font-size:14px;background:var(--accent);color:#fff;width:100%}
.btn.line{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.write{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.write label{font-size:12.5px;font-weight:700}
.write label span{color:var(--green);margin-left:4px}
.write input,.write textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;font:inherit;color:var(--ink);resize:vertical}
.write .hint{font-size:11.5px;color:var(--sub);margin:0}
.star-pick{display:flex;gap:2px}
.star-pick button{border:0;background:none;padding:0 1px}
.star-pick button i{width:28px;height:28px;display:block;background:var(--star-off);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star-pick button.on i{background:var(--star)}
.locating{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);justify-content:center;padding:14px}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rv{padding-block:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rv p{line-height:1.7}
.rv:first-child{border-top:0}
.rv .who{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center}
.rv .who .av{width:36px;height:36px;font-size:13px}
.rv .who b{font-size:13.5px;margin-right:4px}
.rv .who span.d{display:block;font-size:11.5px;color:var(--sub)}
.rv .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.rv .meta .val{font-size:15px}
.visit{background:var(--green-soft);color:var(--green);border-radius:6px;padding:0 8px;font-weight:700;font-size:11px}
.rv .menu{font-size:12.5px} .rv .menu span{color:var(--sub)}

.btn:disabled{opacity:.35;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{-webkit-text-size-adjust:100%}

.intro-shot{width:min(80%,clamp(170px,calc((100vh - 420px) * .65),300px));border-radius:22px;border:5px solid #2A2420;box-shadow:0 10px 24px rgba(42,36,32,.18);background:#fff}

.intro-shot{position:relative;overflow:hidden;aspect-ratio:390/600}
.intro-screen{position:absolute;left:0;top:0;width:390px;height:600px;transform:scale(var(--k,.6));transform-origin:0 0;pointer-events:none;overflow:hidden;background:var(--page);text-align:left}

.intro-screen nav.tabs{position:absolute}

.intro-screen .app{position:relative;height:600px;min-height:0;overflow:hidden}
.intro-screen header.top{position:relative;top:0}
.intro-screen nav.tabs{position:absolute;left:0;right:0;bottom:0}

.intro-screen .cdock,.intro-screen .actbar{position:absolute;left:0;right:0;bottom:0;margin:0;z-index:3}
.intro-screen .locbtn{position:absolute}
.intro-screen *{animation:none!important;transition:none!important}

function rel(t){const d=(Date.now()-new Date(t))/1000;if(d<60)return '방금';if(d<3600)return Math.floor(d/60)+'분 전';if(d<86400)return Math.floor(d/3600)+'시간 전';if(d<604800)return Math.floor(d/86400)+'일 전';return ymd(t);}
function ymd(t){const x=new Date(t);return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`;}
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function distM(lat1,lng1,lat2,lng2){const R=6371000,toR=Math.PI/180,dLa=(lat2-lat1)*toR,dLo=(lng2-lng1)*toR;const a=Math.sin(dLa/2)**2+Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
const walk=m=>Math.max(1,Math.round(m/67));

function compress(file,max=1200,q=.82){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('사진을 처리하지 못했어요'));},'image/jpeg',q);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('사진을 열지 못했어요. JPG나 PNG로 올려 주세요'));};img.src=url;});}
async function uploadPhoto(bucket,file,max=1200){
  const blob=await compress(file,max);const path=`${S.uid}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error)throw error;
  return bucket==='verify'?path:sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

  {rect,page}));}
const NEAR_M=1500;   // 학교에서 이 거리 안의 가게를 모두 불러와요
// 카카오는 한 번 검색에 최대 45곳까지만 줘서, 지역을 칸으로 나눠 칸마다 검색해요. 가게가 많은 칸은 더 잘게 나눠요.
async function gridSearch(code,c){
  const dy=1/111000,dx=1/(111000*Math.cos(c.y*Math.PI/180)),out=[];
  async function cell(x1,y1,x2,y2,depth){
    const rect=`${x1},${y1},${x2},${y2}`;
    const first=await kCat(code,rect,1);
    if(first.total>45&&depth<3){const mx=(x1+x2)/2,my=(y1+y2)/2;
      await Promise.all([cell(x1,y1,mx,my,depth+1),cell(mx,y1,x2,my,depth+1),cell(x1,my,mx,y2,depth+1),cell(mx,my,x2,y2,depth+1)]);return;}
    out.push(...first.data);
    for(let page=2,more=first.more;more&&page<=3;page++){const r=await kCat(code,rect,page);out.push(...r.data);more=r.more;}
  }
  const R=NEAR_M,step=R*2/3,jobs=[];
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){
    const x1=c.x+(-R+i*step)*dx,y1=c.y+(-R+j*step)*dy;jobs.push(()=>cell(x1,y1,x1+step*dx,y1+step*dy,0));}
  for(let k=0;k<jobs.length;k+=3)await Promise.all(jobs.slice(k,k+3).map(f=>f()));
  return out;
}
async function nearbyKakao(){
  const key='ul_near_v3_'+S.school.id,c=store.get(key);
  if(c){try{const v=JSON.parse(c);if(Date.now()-v.t<6*3600e3&&v.d.length)return v.d;}catch(e){}}
  const all=[...await gridSearch('FD6',S.coord),...await gridSearch('CE7',S.coord)];
  const seen=new Set(),d=[];
  all.forEach(x=>{if(seen.has(x.id))return;seen.add(x.id);if(distM(S.coord.y,S.coord.x,+x.y,+x.x)<=NEAR_M)
    d.push({id:x.id,place_name:x.place_name,category_name:x.category_name,phone:x.phone,address_name:x.address_name,road_address_name:x.road_address_name,x:x.x,y:x.y,place_url:x.place_url});});
  store.set(key,JSON.stringify({t:Date.now(),d}));
  return d;
}

async function ensurePlace(p){
  if(p._inDb)return;
  const {error}=await sb.from('ul_places').upsert({id:p.id,name:p.name,category:p.catFull,phone:p.phone,address:p.address,road_address:p.road,x:p.x,y:p.y,place_url:p.url},{onConflict:'id',ignoreDuplicates:true});
  if(error)throw error;p._inDb=true;
}
function addPlace(p,inList){if(!S.placeMap[p.id])S.placeMap[p.id]=p;else p=S.placeMap[p.id];if(inList&&!S.places.includes(p))S.places.push(p);return p;}

async function loadPlaces(){
  S.placesState='loading';renderList();
  (await nearbyKakao()).forEach(d=>addPlace(fromKakao(d),true));
  // 카카오 검색에서 빠졌더라도, 학교 근처에서 누가 리뷰·저장·방문 인증한 가게는 항상 목록에 넣어요
  await addKnownNearby();
  const {data:sv}=await sb.from('ul_saved_places').select('place_id, ul_places(*)').order('created_at',{ascending:false});
  S.saved=new Set((sv||[]).map(x=>x.place_id));
  (sv||[]).forEach(x=>{if(x.ul_places){const p=addPlace(fromRow(x.ul_places),false);p._inDb=true;}});
  await loadReviewsFor(Object.keys(S.placeMap));
  await loadMyVisits();
  S.placesState='ok';renderAll();
}
async function addKnownNearby(){
  const c=S.coord,R=3000,dy=R/111000,dx=R/(111000*Math.cos(c.y*Math.PI/180));
  for(let from=0;from<6000;from+=1000){
    const {data,error}=await sb.from('ul_places').select('*').gte('x',c.x-dx).lte('x',c.x+dx).gte('y',c.y-dy).lte('y',c.y+dy).range(from,from+999);
    if(error||!data)break;
    data.forEach(r=>{if(r.x&&r.y&&distM(c.y,c.x,r.y,r.x)<=R){const p=addPlace(fromRow(r),true);p._inDb=true;}});
    if(data.length<1000)break;
  }
}
async function loadReviewsFor(ids){
  ids=[...new Set(ids)];if(!ids.length)return;
  ids.forEach(id=>{if(S.placeMap[id])S.placeMap[id].reviews=[];});
  const rows=[];
  for(let i=0;i<ids.length;i+=60){
    const {data,error}=await sb.from('ul_reviews').select('*').in('place_id',ids.slice(i,i+60)).order('created_at',{ascending:false}).limit(3000);
    if(error)throw error;rows.push(...(data||[]));
  }
  rows.forEach(r=>{const p=S.placeMap[r.place_id];if(p){p.reviews.push(r);p._inDb=true;}});
  await ensureUsers(rows.map(r=>r.user_id));
  if(rows.length){const {data:lk}=await sb.from('ul_review_likes').select('review_id').in('review_id',rows.map(r=>r.id).slice(0,900));(lk||[]).forEach(x=>S.likedRev.add(x.review_id));}
}
async function loadMyVisits(){
  const {data}=await sb.from('ul_visits').select('place_id,visit_day').eq('user_id',S.uid);
  const t=todayKST(),lim=new Date(Date.now()+9*3600e3-7*864e5).toISOString().slice(0,10);S.visits={};
  (data||[]).forEach(v=>{const o=S.visits[v.place_id]||(S.visits[v.place_id]={n:0,today:false,recent:false});o.n++;if(v.visit_day===t)o.today=true;if(v.visit_day>=lim)o.recent=true;});
}
async function openPlaceById(id,tab){
  let p=find(id);
  if(!p){const {data}=await sb.from('ul_places').select('*').eq('id',id).maybeSingle();if(!data){toast('가게 정보를 찾지 못했어요');return;}p=addPlace(fromRow(data),false);p._inDb=true;}
  if(!p._loaded){await loadReviewsFor([p.id]);p._loaded=true;}
  openSheet(p.id,tab);
}
async function searchMore(q){
  if(!window.kakao||!S.coord){toast('지도를 불러온 뒤에 다시 해 주세요');return;}
  const loc=new kakao.maps.LatLng(S.coord.y,S.coord.x);
  const r=(await kKey(q,{location:loc,radius:3000,sort:kakao.maps.services.SortBy.DISTANCE})).filter(d=>['FD6','CE7'].includes(d.category_group_code));
  if(!r.length){toast(`주변 3km 안에서 "${q}"에 맞는 가게를 못 찾았어요`);return;}
  const ids=r.map(d=>addPlace(fromKakao(d),true).id);await loadReviewsFor(ids);S.searchHit=new Set(ids);renderList();renderMap();toast(`${ids.length}곳을 더 찾았어요`);
}

/* ---------- 점수 ---------- */
const wOf=id=>LV[lvOf(U[id]?.helpful)].w;
const isLatest=(p,rv)=>p.reviews.find(x=>x.user_id===rv.user_id)===rv;
function scoreOf(p,kind){let ws=0,w=0,s=0,n=0;const seen=new Set();
  p.reviews.forEach(r=>{if(seen.has(r.user_id))return;seen.add(r.user_id);if(kind&&(kind==='delivery')!==(r.kind==='delivery'))return;
    const k=wOf(r.user_id);ws+=+r.rating*k;w+=k;s+=+r.rating;n++;});
  return {w:n?ws/w:0,avg:n?s/n:0,n};}
const starsHTML=v=>{let o='<span class="stars" aria-hidden="true">';for(let i=1;i<=5;i++)o+=`<i class="${v>=i-.25?'on':(v>=i-.75?'half':'')}"></i>`;return o+'</span>';};
const bestReview=p=>[...p.reviews].sort((a,b)=>(wOf(b.user_id)*20+b.likes)-(wOf(a.user_id)*20+a.likes))[0];
const photosOf=p=>p.reviews.flatMap(r=>r.photos||[]);
function priceOf(p){const c=[0,0,0,0,0];let n=0;p.reviews.forEach(r=>{if(r.price_level!=null){c[r.price_level]++;n++;}});if(!n)return '';return '1인 '+PRICES[c.indexOf(Math.max(...c))];}
function tagsOf(p){const c={};p.reviews.forEach(r=>(r.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
function thumb(p,label=true,i=0,cls=''){const ph=photosOf(p)[i];if(ph)return `<span class="thumb ${cls}" style="background:url('${esc(ph)}') center/cover"></span>`;
  return `<span class="thumb ph ${cls}" aria-hidden="true"></span>`;}
const miniThumb=p=>thumb(p,true,0,'mini');

function renderWhere(){
  const label=S.school?(S.school.campus?`${S.school.short} ${S.school.campus}`:S.school.short):'';
  $('#where').innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span><b>${esc(label)}</b> 주변 맛집</span>${S.isAdmin?`<span class="wsw-wrap">${isOtherSchool()?'<button class="wsw home" type="button" data-school-home>내 학교로</button>':''}<button class="wsw" type="button" data-school-switch>${isOtherSchool()?'학교 바꾸기':'다른 학교 보기'} ▾</button></span>`:''}`;
  $('#where').classList.toggle('other',isOtherSchool());
}
function filtered(){
  const q=S.q.trim();
  return S.places.filter(p=>(!S.genre||p.cat===S.genre)&&(!S.tag||tagsOf(p).includes(S.tag))&&
    (!q||p.name.includes(q)||p.catFull.includes(q)||p.reviews.some(r=>(r.menu||'').includes(q)||r.body.includes(q))||(S.searchHit&&S.searchHit.has(p.id))));
}
function renderFilters(){
  const c={};S.places.forEach(p=>c[p.cat]=(c[p.cat]||0)+1);
  const cats=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  $('#genre').innerHTML=[`<button type="button" data-genre="" aria-pressed="${!S.genre&&!S.tag}">전체</button>`]
    .concat(cats.map(g=>`<button type="button" data-genre="${esc(g)}" aria-pressed="${S.genre===g}">${esc(g)}</button>`))
    .concat(TAGS.map(t=>`<button type="button" data-tag="${t}" aria-pressed="${S.tag===t}">${t}</button>`)).join('');
}
function renderList(){
  const el=$('#placeList');
  if(S.placesState==='loading'){el.innerHTML='<div class="empty"><span class="spin"></span><br>학교 주변 가게를 불러오는 중이에요</div>';return;}
  if(S.placesState==='error'){el.innerHTML=`<div class="empty">${S.placesErr}</div>`;return;}
  const ps=filtered();
  const has=p=>p.reviews.length>0;
  ps.sort(S.sort==='dist'?(a,b)=>a.dist-b.dist:S.sort==='reviews'?(a,b)=>b.reviews.length-a.reviews.length||a.dist-b.dist
    :(a,b)=>(has(b)-has(a))||(scoreOf(b).w-scoreOf(a).w)||(a.dist-b.dist));
  const q=S.q.trim();
  const more=q?`<button class="morebtn" type="button" data-searchmore>🔍 주변 3km에서 "${esc(q)}" 더 찾기</button>`:'';
  el.innerHTML= ps.length? ps.slice(0,S.listShow).map((p,i)=>{
    const s=scoreOf(p),b=bestReview(p),rank=S.sort==='score'&&has(p)?i+1:0,pc=photosOf(p).length,price=priceOf(p);
    return `<button class="rs" data-open="${p.id}" type="button">${thumb(p)}
        <span class="info">
          <span class="top">${rank?`<span class="rank num${rank>3?' low':''}">${rank}위</span>`:''}<span class="nm">${esc(p.name)}</span></span>
          <span class="area">${esc(p.cat)} · 도보 ${walk(p.dist)}분${S.saved.has(p.id)?' · ★ 저장함':''}</span>
          ${has(p)?`<span class="rating">${starsHTML(s.w)}<span class="val num">${s.w.toFixed(2)}</span><span class="rcount num">리뷰 ${p.reviews.length}${pc?` · 사진 ${pc}`:''}</span></span>`
            :`<span class="rating"><span class="rcount first">${firstCall()}</span></span>`}
          ${price?`<span class="budget">${price}</span>`:''}
          ${b?`<span class="snip">“${esc(b.body)}”</span>`:''}
        </span></button>`}).join('')+(ps.length>S.listShow?`<button class="morebtn" type="button" data-listmore>가게 더 보기 ▼ <small class="num">(${S.listShow}/${ps.length})</small></button>`:'')+more
    : `<div class="empty">조건에 맞는 가게가 없어요. 검색어나 조건을 바꿔보세요.</div>${more}`;
}
const PIN_ICON=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v8a3 3 0 0 0 3 3v7M7 3v6M10 3v8a3 3 0 0 1-3 3M17 21V3c-2 1-3 4-3 7s1 4 3 4"/></svg>`;
function renderMap(){
  const el=$('#map');$('#mapWrap').hidden=!S.mapOn;
  if(!S.mapOn){stopWatch();return;}
  if(!window.kakao||!S.coord)return;
  const center=new kakao.maps.LatLng(S.coord.y,S.coord.x);
  if(!S.kmap){S.kmap=new kakao.maps.Map(el,{center,level:4});kakao.maps.event.addListener(S.kmap,'dragstart',()=>{S.follow=false;});
    kakao.maps.event.addListener(S.kmap,'idle',()=>{clearTimeout(S.pinT);S.pinT=setTimeout(renderPins,120);});}
  else S.kmap.relayout();
  startWatch();
  renderPins();
}
// 리뷰 있는 가게는 모두, 아직 리뷰 없는 가게는 지금 보이는 화면 안에서 가까운 곳만 (너무 빽빽하지 않게)
function renderPins(){
  if(!S.kmap)return;
  S.overlays.forEach(o=>o.setMap(null));
  const has=p=>p.reviews.length>0,all=filtered().filter(p=>p.x&&p.y);
  const bd=S.kmap.getBounds(),ct=S.kmap.getCenter(),lv=S.kmap.getLevel();
  const cap=lv<=2?150:lv===3?70:lv===4?40:15;
  const empty=all.filter(p=>!has(p)&&bd.contain(new kakao.maps.LatLng(p.y,p.x)))
    .sort((a,b)=>distM(ct.getLat(),ct.getLng(),a.y,a.x)-distM(ct.getLat(),ct.getLng(),b.y,b.x)).slice(0,cap);
  S.overlays=[...all.filter(has),...empty].map(p=>{
    const d=document.createElement('button');d.type='button';d.className='kpin'+(p.reviews.length?'':' none');
    d.innerHTML=p.reviews.length?`<b class="num">${scoreOf(p).w.toFixed(2)}</b>`:PIN_ICON;d.title=p.name;d.setAttribute('aria-label',p.name);
    d.onclick=()=>openSheet(p.id);
    const o=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.y,p.x),content:d,yAnchor:1.1,zIndex:p.reviews.length?3:2});o.setMap(S.kmap);return o;});
}
/* 내 위치: 지도를 켜 둔 동안 계속 따라가요 */
function startWatch(){
  if(S.watchId!=null||!navigator.geolocation)return;
  S.watchId=navigator.geolocation.watchPosition(pos=>{
    const {latitude:la,longitude:lo,accuracy:ac}=pos.coords;S.myPos={y:la,x:lo,ac};
    if(!S.kmap)return;const ll=new kakao.maps.LatLng(la,lo);
    if(!S.meOv){const me=document.createElement('span');me.className='me-dot';S.meOv=new kakao.maps.CustomOverlay({position:ll,content:me,zIndex:5});S.meOv.setMap(S.kmap);
      S.meCircle=new kakao.maps.Circle({center:ll,radius:Math.min(ac,500),strokeWeight:1,strokeColor:'#2F7BFF',strokeOpacity:.35,fillColor:'#2F7BFF',fillOpacity:.1});S.meCircle.setMap(S.kmap);}
    else{S.meOv.setPosition(ll);S.meCircle.setPosition(ll);S.meCircle.setRadius(Math.min(ac,500));}
    if(S.follow)S.kmap.panTo(ll);
    $('#locBtn').classList.add('on');
  },err=>{S.watchId=null;$('#locBtn').classList.remove('on');
    if(S.follow){S.follow=false;toast(err.code===1?'위치 권한을 허용하면 지도에 내 위치가 보여요':'내 위치를 확인하지 못했어요');}
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
function stopWatch(){if(S.watchId!=null){navigator.geolocation.clearWatch(S.watchId);S.watchId=null;}S.follow=false;}
function locateMe(){
  if(!navigator.geolocation){toast('이 기기에서는 위치를 확인할 수 없어요');return;}
  S.follow=true;if(S.watchId==null)startWatch();
  if(S.myPos&&S.kmap){S.kmap.setLevel(3);S.kmap.panTo(new kakao.maps.LatLng(S.myPos.y,S.myPos.x));}
  else toast('내 위치를 찾는 중이에요…');
}
function renderAll(){renderWhere();renderFilters();renderList();renderMap();}

function keepScroll(fn){const sh=$('#sheet'),st=sh.scrollTop;fn();sh.scrollTop=st;}

function bindPost(){
  const sh=$('#psheet'),on=(sel,fn)=>sh.querySelectorAll(sel).forEach(x=>x.onclick=e=>fn(x,e));
  const keep=fn=>{const st=sh.scrollTop;fn();sh.scrollTop=st;};
  const reload=async()=>{const st=sh.scrollTop;await loadPost(PO.id);renderPost();sh.scrollTop=st;};
  on('[data-pclose]',closePost);
  on('[data-pcancel]',()=>{postMode='view';editPost=null;renderPost();});
  on('[data-pcat]',x=>{pdraft.cat=x.dataset.pcat;sh.querySelectorAll('[data-pcat]').forEach(b=>b.setAttribute('aria-pressed',b===x));});
  const pt=$('#pTitle');if(pt)pt.oninput=e=>pdraft.title=e.target.value;
  const pb=$('#pBody');if(pb)pb.oninput=e=>pdraft.body=e.target.value;
  const pp=$('#pPlace');if(pp)pp.onchange=e=>pdraft.place=e.target.value;
  on('[data-psubmit]',async()=>{
    if(pdraft.title.trim().length<2){toast('제목을 2자 이상 적어주세요');return;}
    if(pdraft.body.trim().length<5){toast('내용을 5자 이상 적어주세요');return;}
    pbusy=true;renderPost();
    const row={cat:pdraft.cat,title:pdraft.title.trim(),body:pdraft.body.trim(),place_id:pdraft.place||null};
    const res=editPost?await sb.from('ul_posts').update(row).eq('id',editPost.id).select().single():await sb.from('ul_posts').insert(row).select().single();
    pbusy=false;
    if(res.error){toast('올리지 못했어요: '+errText(res.error));renderPost();return;}
    const was=!!editPost;editPost=null;postMode='view';S.talk.page=1;if(!was)S.talk.cat='전체';
    loadTalk();loadCounts();S.meCache={};await openPost(res.data.id);toast(was?'글을 수정했어요':'글을 올렸어요');});
  on('[data-goplace]',x=>{closePost();openPlaceById(x.dataset.goplace);});
  if(postMode!=='view'||!PO)return;
  const po=PO;
  on('[data-pedit-post]',()=>{editPost=po;pdraft={cat:po.cat,title:po.title,body:po.body,place:po.place_id||''};postMode='write';renderPost();sh.scrollTop=0;});
  on('[data-pdel]',()=>{delPost=true;keep(renderPost);});
  on('[data-pdelno]',()=>{delPost=false;keep(renderPost);});
  on('[data-pdelyes]',async()=>{const {error}=await sb.from('ul_posts').delete().eq('id',po.id);if(error){toast('삭제하지 못했어요: '+errText(error));return;}closePost();loadTalk();loadCounts();S.meCache={};await refreshMe();toast('글을 삭제했어요');});
  on('[data-plike]',async()=>{if(!needApproved('공감'))return;const on=S.likedPost.has(po.id);
    const {error}=on?await sb.from('ul_post_likes').delete().eq('post_id',po.id).eq('user_id',S.uid):await sb.from('ul_post_likes').insert({post_id:po.id});
    if(error&&error.code!=='23505'){toast(errText(error));return;}
    on?(S.likedPost.delete(po.id),po.likes--):(S.likedPost.add(po.id),po.likes++);keep(renderPost);const li=S.talk.list.find(x=>x.id===po.id);if(li)li.likes=po.likes;renderTalk();});
  on('[data-pbm]',async()=>{const on=S.bmPost.has(po.id);
    const {error}=on?await sb.from('ul_post_bookmarks').delete().eq('post_id',po.id).eq('user_id',S.uid):await sb.from('ul_post_bookmarks').insert({post_id:po.id});
    if(error&&error.code!=='23505'){toast(errText(error));return;}
    on?S.bmPost.delete(po.id):S.bmPost.add(po.id);S.meCache.bm=null;keep(renderPost);renderTalk();renderMeTabs();toast(on?'북마크를 해제했어요':'북마크했어요 · 마이페이지에서 다시 볼 수 있어요');});

  on('[data-reply]',x=>{if(!needApproved('답글을'))return;const j=+x.dataset.reply;replyTo=replyTo===j&&!replyMention?-1:j;replyMention=null;cpick.open=false;keep(renderPost);if(replyTo>=0)$('#cIn').focus();});
  on('[data-rreply]',x=>{if(!needApproved('답글을'))return;const [j,rid]=x.dataset.rreply.split(':').map(Number);const c=po.comments.find(c=>c.id===j),r=c&&c.replies.find(r=>r.id===rid);replyTo=j;replyMention=r&&r.user_id!==S.uid?r.user_id:null;cpick.open=false;keep(renderPost);$('#cIn').focus();});
  on('[data-rcancel]',()=>{replyTo=-1;replyMention=null;keep(renderPost);});
  on('[data-rmore]',x=>{const j=+x.dataset.rmore;openRep.has(j)?openRep.delete(j):openRep.add(j);keep(renderPost);});
  on('[data-cmore]',()=>{showAllC=!showAllC;keep(renderPost);});
  on('[data-ctag]',()=>{cpick.open=!cpick.open;keep(renderPost);});
  on('[data-cpick]',x=>{cpick.place=cpick.place===x.dataset.cpick?'':x.dataset.cpick;cpick.open=false;keep(renderPost);$('#cIn').focus();});
  const cin=$('#cIn');if(cin){cin.oninput=e=>cpick.text=e.target.value;cin.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sh.querySelector('[data-csend]').click();}};}
  on('[data-csend]',async()=>{
    if(!needApproved('댓글을'))return;const t=cpick.text.trim();if(t.length<1){toast('내용을 적어주세요');return;}
    pbusy=true;const row={post_id:po.id,body:t};
    if(replyTo>=0){row.parent_id=replyTo;if(replyMention)row.mention=replyMention;}else if(cpick.place)row.place_id=cpick.place;
    const {error}=await sb.from('ul_comments').insert(row);pbusy=false;
    if(error){toast('남기지 못했어요: '+errText(error));return;}
    if(replyTo>=0)openRep.add(replyTo);const wasReply=replyTo>=0;replyTo=-1;replyMention=null;cpick={open:false,place:'',text:''};
    await reload();if(!wasReply)sh.scrollTop=sh.scrollHeight;
    const li=S.talk.list.find(x=>x.id===po.id);if(li){li.comment_count=PO.comment_count;renderTalk();}S.meCache.cmts=null;loadCounts();toast(wasReply?'답글을 남겼어요':'댓글을 남겼어요');});
  on('[data-clike]',async x=>{if(!needApproved('"도움돼요"를 누를'))return;const id=+x.dataset.clike;const on=likedCm.has(id);
    const {error}=on?await sb.from('ul_comment_likes').delete().eq('comment_id',id).eq('user_id',S.uid):await sb.from('ul_comment_likes').insert({comment_id:id});
    if(error&&error.code!=='23505'){toast(errText(error));return;}
    const all=po.comments.flatMap(c=>[c,...(c.replies||[])]),c=all.find(c=>c.id===id);
    if(c){on?(likedCm.delete(id),c.likes--,U[c.user_id]&&U[c.user_id].helpful--):(likedCm.add(id),c.likes++,U[c.user_id]&&U[c.user_id].helpful++);}keep(renderPost);});
  on('[data-adopt]',async x=>{const {error}=await sb.rpc('ul_adopt',{p_comment:+x.dataset.adopt});if(error){toast(errText(error));return;}await reload();toast('답변을 채택했어요 · 답변한 사람에게 도움돼요 3개가 더해져요');});
  on('[data-cedit]',x=>{cEdit=+x.dataset.cedit;cDel=-1;keep(renderPost);const t=$('#cEditIn');if(t)t.focus();});
  on('[data-cedno]',()=>{cEdit=-1;keep(renderPost);});
  on('[data-cedyes]',async x=>{const t=$('#cEditIn').value.trim();if(!t){toast('내용을 적어주세요');return;}const {error}=await sb.from('ul_comments').update({body:t}).eq('id',+x.dataset.cedyes);if(error){toast(errText(error));return;}cEdit=-1;S.meCache.cmts=null;await reload();toast('수정했어요');});
  on('[data-cdel]',x=>{cDel=+x.dataset.cdel;cEdit=-1;keep(renderPost);});
  on('[data-cdelno]',()=>{cDel=-1;keep(renderPost);});
  const delC=async id=>{const {error}=await sb.from('ul_comments').delete().eq('id',id);if(error){toast(errText(error));return;}cDel=-1;S.meCache.cmts=null;await reload();await refreshMe();loadCounts();const li=S.talk.list.find(x=>x.id===po.id);if(li){li.comment_count=PO.comment_count;renderTalk();}toast('삭제했어요');};
  on('[data-cdelyes]',x=>delC(+x.dataset.cdelyes));
  on('[data-rdel]',x=>delC(+x.dataset.rdel));
}

let rep={type:'',id:0,reason:''};

const PERIOD_CAP={all:'가입 후 지금까지 받은 "도움돼요" 기준',month:'이번 달 1일부터 받은 "도움돼요" 기준',week:'이번 주 월요일부터 받은 "도움돼요" 기준'};

  S.rank.list=data||[];S.rank.loaded=true;(data||[]).forEach(r=>{U[r.user_id]=Object.assign(U[r.user_id]||{},{id:r.user_id,nick:r.nick,photo_url:r.photo_url,school_short:r.school_short,year:r.year,helpful:r.helpful,verified:!!r.verified});});

function renderPeople(){
  $('#tiers').innerHTML=`<tr><th>등급</th>${LV.map((l,i)=>`<td><span class="lv l${i}">${l.name}</span></td>`).join('')}</tr><tr><th>도움돼요</th>${LV.map(l=>`<td class="num">${l.min}개+</td>`).join('')}</tr><tr><th>점수 반영</th>${LV.map(l=>`<td class="num"><b>×${l.w}</b></td>`).join('')}</tr>`;

  $('#periodCap').textContent=PERIOD_CAP[S.rank.period]+' · 등급은 전체 기준이에요';
  document.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.period===S.rank.period));
  if(!S.rank.loaded){$('#peopleList').innerHTML='<div class="empty"><span class="spin"></span></div>';return;}
  const all=S.rank.list,show=all.slice(0,S.rank.show),meIdx=all.findIndex(r=>r.user_id===S.uid);

      <span class="who"><b>${esc(r.user_id===S.uid?'나 ('+r.nick+')':r.nick)}</b>${lvBadge(r.helpful)}${certB(r)}<span class="d">${esc(r.school_short+' '+r.year)} · 리뷰 ${r.reviews} · 댓글 ${r.comments}</span></span>
      <span class="v num">${r.score}<small>도움돼요</small></span></div>`;
  $('#peopleList').innerHTML=(all.length?show.map((r,i)=>row(r,i+1)).join(''):'<div class="empty">아직 랭킹에 오른 학생이 없어요. 첫 리뷰를 남겨 1위가 되어 보세요.</div>')
    +(meIdx>=S.rank.show?row(all[meIdx],meIdx+1):'')

}

  if(k==='posts'){L=S.meCache.posts;html=L.length?cut(L).map(po=>`<button class="post" type="button" data-post="${po.id}"><span class="ptop"><span class="pcat">${po.cat}</span><b class="ptitle" style="font-size:14.5px">${esc(po.title)}</b></span><span class="pmeta num">${rel(po.created_at)} · 댓글 ${po.comment_count} · 공감 ${po.likes}</span></button>`).join('')+mb(L.length):'<div class="empty">아직 로그톡에 쓴 글이 없어요.</div>';}
  if(k==='cmts'){L=S.meCache.cmts;html=L.length?cut(L).map(c=>`<button class="post" type="button" data-post="${c.post_id}"><span class="pbody" style="color:var(--ink);-webkit-line-clamp:2">${esc(c.body)}</span><span class="pmeta">${c.parent_id?'<span>↳ 답글</span>':''}${c.best?'<span class="bestTag" style="padding:0 5px">✓ 채택</span>':''}<span>「${esc(c.ul_posts?.title||'삭제된 글')}」</span><span class="num">· ${rel(c.created_at)} · 도움돼요 ${c.likes}</span></span></button>`).join('')+mb(L.length):'<div class="empty">아직 로그톡에 단 댓글이 없어요.</div>';}
  if(k==='saved'){L=savedHere();html=L.length?cut(L).map(p=>`<button class="row2" type="button" data-openplace="${p.id}" style="grid-template-columns:56px 1fr auto">${miniThumb(p)}<span class="who"><b>${esc(p.name)}</b><span class="d">${esc(p.cat)} · 도보 ${walk(p.dist)}분</span></span><span class="v num" style="color:var(--accent)">${p.reviews.length?scoreOf(p).w.toFixed(2):'-'}<small>리뷰 ${p.reviews.length}</small></span></button>`).join('')+mb(L.length):'<div class="empty">가게 화면 아래 ☆ 저장을 누르면 여기에 모여요.</div>';}

const unread=()=>S.notis.filter(n=>!n.read).length;
function notiText(n){const m=n.meta||{};
  switch(n.type){
    case 'like':return n.review_id?`<b>${esc(m.place||'가게')}</b>에 남긴 내 리뷰에 도움돼요 ${n.count}개가 달렸어요`:`「${esc(m.title||'글')}」에 단 내 댓글에 도움돼요 ${n.count}개가 달렸어요`;
    case 'cmt':{const w=m.cat==='질문'?'답변':'댓글';return `내 글 「${esc(m.title)}」에 새 ${w}${n.count>1?` ${n.count}개가`:'이'} 달렸어요`;}
    case 'reply':return `「${esc(m.title)}」의 내 댓글에 답글${n.count>1?` ${n.count}개가`:'이'} 달렸어요`;
    case 'adopt':return `「${esc(m.title)}」에 단 내 답변이 채택됐어요 · 도움돼요 +3`;
    case 'up':return `<b>${esc(m.level)}</b> 등급이 됐어요! 이제 내 평가가 가게 점수에 더 크게 반영돼요`;
    case 'verify':return m.status==='approved'?'재학생 인증이 승인됐어요! 이제 내 리뷰와 글에 재학생 인증 뱃지가 붙어요':`재학생 인증이 반려됐어요${m.reason?' · 사유: '+esc(m.reason):''}`;
    default:return '새 알림이 있어요';}}
const nIcon=t=>({like:'like',cmt:'cmt',reply:'cmt',adopt:'adopt',up:'up'}[t]||'info');
async function loadNotis(){
  const {data}=await sb.from('ul_notifications').select('*').order('updated_at',{ascending:false}).limit(80);
  const before=unread();S.notis=data||[];updateBadges();if(!$('#nscrim').hidden)renderNoti();
  if(S.me&&S.me.status==='pending'&&S.notis.some(n=>n.type==='verify'&&!n.read)){await route();return;}
  if(unread()>before&&before>=0&&S._notiLoaded)toast(`새 알림 ${unread()-before}개 · 마이페이지 🔔에서 확인하세요`);S._notiLoaded=true;
}
function updateBadges(){const n=unread(),b=$('#meBadge');b.hidden=!n;b.textContent=n>99?'99+':n;
  const bell=$('#profile .bell');if(bell){bell.setAttribute('aria-label',`알림 ${n}개`);let d=bell.querySelector('.nbadge');if(n){if(!d){d=document.createElement('span');d.className='nbadge num';bell.appendChild(d);}d.textContent=n>99?'99+':n;}else if(d)d.remove();}}
function openNoti(){S.notiAll=false;renderNoti();$('#nscrim').hidden=false;}
function renderNoti(){
  const L=S.notis,SHOW=8,list=S.notiAll?L:L.slice(0,SHOW),un=unread();
  $('#nsheet').innerHTML=`<div class="gut pe-wrap" style="gap:10px">
    <div class="nhead"><h3>알림 ${un?`<span class="nbadge num" style="position:static">${un}</span>`:''}</h3><span>${un?'<button class="report" type="button" data-nreadall>모두 읽음</button>':''}<button class="x" type="button" data-nclose aria-label="닫기">×</button></span></div>
    ${L.length?`<div class="nlist">${list.map(n=>`<button class="nitem ${n.read?'':'unread'}" type="button" data-nopen="${n.id}"><span class="nic t-${nIcon(n.type)}">${NICON[nIcon(n.type)]}</span><span class="ntx"><span>${notiText(n)}</span><time>${rel(n.updated_at)}</time></span>${n.read?'':'<i class="ndot" aria-label="안 읽음"></i>'}</button>`).join('')}</div>
      ${L.length>SHOW?`<button class="morebtn" type="button" data-nmore>${S.notiAll?'접기 ▲':`알림 ${L.length}개 모두 보기 ▼`}</button>`:''}`:'<div class="empty">아직 알림이 없어요.</div>'}
    <p class="hint" style="margin:0;font-size:11.5px;color:var(--sub)">같은 글·리뷰에서 생긴 "도움돼요"와 댓글 알림은 하나로 묶어서 보내드려요.</p></div>`;
  const sh=$('#nsheet');
  sh.querySelectorAll('[data-nclose]').forEach(x=>x.onclick=()=>$('#nscrim').hidden=true);
  sh.querySelectorAll('[data-nmore]').forEach(x=>x.onclick=()=>{S.notiAll=!S.notiAll;renderNoti();});
  sh.querySelectorAll('[data-nreadall]').forEach(x=>x.onclick=async()=>{await sb.from('ul_notifications').update({read:true}).eq('user_id',S.uid).eq('read',false);S.notis.forEach(n=>n.read=true);updateBadges();renderNoti();toast('알림을 모두 읽었어요');});
  sh.querySelectorAll('[data-nopen]').forEach(x=>x.onclick=async()=>{const n=S.notis.find(z=>z.id===+x.dataset.nopen);if(!n)return;
    if(!n.read){n.read=true;sb.from('ul_notifications').update({read:true}).eq('id',n.id).then(()=>{});updateBadges();}
    if(n.review_id&&n.place_id){$('#nscrim').hidden=true;openPlaceById(n.place_id,'rev');}
    else if(n.post_id){$('#nscrim').hidden=true;openPost(n.post_id);}
    else renderNoti();});
}

  if(s===2){
    body=`<h2 class="ob-t">다니는 학교를 골라주세요</h2><p class="ob-d">서울·경기와 광역시·제주 지역 대학에서 먼저 시작해요. 캠퍼스가 여러 곳이면 다니는 캠퍼스를 골라주세요.</p>

  if(s===4&&vm){btn=ob.busy?'보내는 중…':'인증 신청';
    body=`<h2 class="ob-t">인증 정보를 확인해 주세요</h2><p class="ob-d">학과는 인증 확인에만 쓰고 다른 사람에게는 보이지 않아요.</p>

      ${ob.err?`<div class="cp-empty" style="margin:0;color:var(--accent)">${esc(ob.err)}</div>`:''}`;}
  else if(s===4){btn=ob.busy?'보내는 중…':ob.skip?'시작하기':'가입 신청';
    body=`<h2 class="ob-t">리뷰에 보일 프로필을<br>만들어 주세요</h2>
      <div class="fld"><label for="obNick">닉네임</label><input id="obNick" maxlength="10" value="${esc(ob.nick)}" placeholder="예) 회기동국밥러" autocomplete="off"><span class="msg ${ob.nickOk?'ok':ob.nickMsg&&ob.nick?'bad':''}" id="nickMsg">${esc(ob.nickMsg||'2~10자, 한글·영문·숫자로 지어주세요')}</span></div>
      ${ob.skip?'':deptField()}
      <div class="fld"><label for="obYear">학번</label><select id="obYear"><option value="">학번 선택</option>${YEARS.map(y=>`<option ${ob.year===y?'selected':''}>${y}</option>`).join('')}</select></div>
      <p class="hint" style="margin:-8px 0 0;font-size:12.5px;color:var(--sub)">${ob.skip?'리뷰와 로그톡에는 "학교 + 학번"만 표시돼요.':'학과는 재학생 인증에만 쓰고 다른 사람에게는 보이지 않아요. 리뷰와 로그톡에는 "학교 + 학번"만 표시돼요.'}</p>
      <div class="preview"><small>리뷰에는 이렇게 보여요</small><div class="pw" id="obPreview"></div></div>
      ${ob.err?`<div class="cp-empty" style="margin:0;color:var(--accent)">${esc(ob.err)}</div>`:''}`;}

function obSync(){
  const nb=$('#obNext');if(nb)nb.disabled=!obOk();
  const pv=$('#obPreview');if(pv){const sc=curSchool(),n=ob.nick.trim()||'닉네임';pv.innerHTML=`<span class="av">${esc(n.slice(0,1))}</span><span><b>${esc(n)}</b>${lvBadge(0)}<span class="d">${esc((sc?sc.short:'')+(ob.year?' '+ob.year:''))}</span></span>`;}
}
function obRender(){
  const el=$('#ob');el.hidden=false;$('#boot').hidden=true;
  const moved=obLast!==ob.step;obLast=ob.step;
  stopIntro();
  el.innerHTML=`<div class="wrap gut${moved?' step-in':''}">${obHTML()}</div>`;if(moved)el.scrollTop=0;obSync();
  if(ob.step===0)initIntro();
  const vm=ob.mode==='verify',bar=el.querySelector('.ob-prog i'),to=typeof ob.step==='number'?(vm?(ob.step-2)/2*100:ob.step/4*100):0;
  if(bar){bar.style.transition='none';bar.style.width=obPrevW+'%';void bar.offsetWidth;bar.style.transition='width .45s cubic-bezier(.4,0,.2,1)';bar.style.width=to+'%';}
  obPrevW=ob.step>=1&&ob.step<=4?to:0;
}
function startVerify(){
  if(!S.me||S.me.status==='approved'||S.me.status==='pending')return;
  ob=Object.assign(ob,{mode:'verify',skip:false,step:3,school:S.me.school_id,nick:S.me.nick||'',nickOk:true,year:S.me.year||'',
    field:'',dept:'',etc:false,file:null,method:'id',busy:false,err:'',rejected:S.me.status==='rejected'?(S.me.reject_reason||'-'):'',agree:{}});
  obPrevW=0;obLast=-1;obRender();
}
async function obSubmit(){
  ob.busy=true;ob.err='';obRender();
  try{
    const vm=ob.mode==='verify',sc=curSchool()||{id:S.me.school_id,n:S.me.school_name,short:S.me.school_short,campus:S.me.campus};
    let error;
    if(ob.skip){
      ({error}=await sb.rpc('ul_join',{p_school_id:sc.id,p_school_name:sc.n,p_school_short:sc.short,p_campus:sc.campus,p_year:ob.year,
        p_nick:ob.nick.trim(),p_agree_loc:!!ob.agree.loc,p_agree_mkt:!!ob.agree.mkt}));
    }else{
      const path=await uploadPhoto('verify',ob.file,1600);
      ({error}=await sb.rpc('ul_submit_verification',{p_school_id:sc.id,p_school_name:sc.n,p_school_short:sc.short,p_campus:sc.campus,p_year:ob.year,
        p_dept_field:ob.field==='__etc'?'':ob.field,p_dept:ob.dept.trim(),p_method:ob.method,p_path:path,p_nick:ob.nick.trim(),
        p_agree_loc:vm?null:!!ob.agree.loc,p_agree_mkt:vm?null:!!ob.agree.mkt}));
    }
    if(error)throw error;
    ob.busy=false;ob.step=5;obRender();
  }catch(e){ob.busy=false;ob.err='보내지 못했어요: '+errText(e);obRender();}
}
function bindOb(){
  const el=$('#ob');
  el.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');
    if(a){const act=a.dataset.act;
      if(act==='kakao')return kakaoLogin();
      if(act==='logout')return sb.auth.signOut().then(()=>location.replace(location.origin+location.pathname));
      if(act==='finish'){el.hidden=true;if(ob.mode==='verify'||S.entered){ob.mode='join';return route();}$('#boot').hidden=false;return route();}
      if(act==='back'){if(ob.mode==='verify'&&ob.step===3){el.hidden=true;ob.mode='join';return;}ob.step=Math.max(1,ob.step-1);return obRender();}
      if(act==='skip'){ob.skip=true;ob.step=4;return obRender();}
      if(act==='next'&&!a.disabled){if(ob.step===4)return obSubmit();if(ob.step===3)ob.skip=false;ob.step++;return obRender();}
      return;}
    const rg=e.target.closest('[data-region]');if(rg){ob.region=rg.dataset.region;el.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b===rg));$('#schoolList').innerHTML=schoolList();$('#schoolList').scrollTop=0;return;}
    const sc=e.target.closest('[data-school]');if(sc){const st=$('#schoolList').scrollTop;ob.school=sc.dataset.school;ob.dept='';ob.field='';ob.etc=false;obRender();$('#schoolList').scrollTop=st;return;}
    const md=e.target.closest('[data-method]');if(md){ob.method=md.dataset.method;obRender();}
  });
  el.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.ag){if(t.dataset.ag==='all')AGREE.forEach(([k])=>ob.agree[k]=t.checked);else ob.agree[t.dataset.ag]=t.checked;obRender();return;}
    if(t.id==='obFile'){ob.file=t.files&&t.files[0]||null;obRender();return;}
    if(t.id==='obField'){ob.field=t.value;ob.dept='';ob.etc=t.value==='__etc';obRender();return;}
    if(t.id==='obDept'){const etc=t.value==='__etc';if(etc!==!!ob.etc&&(etc||(curSchool()||{}).short==='외대')){ob.etc=etc;ob.dept='';obRender();return;}ob.dept=t.value;}
    if(t.id==='obYear')ob.year=t.value;
    obSync();});
  el.addEventListener('input',e=>{const t=e.target;
    if(t.id==='obSchool'){ob.sq=t.value;$('#schoolList').innerHTML=schoolList();}
    if(t.id==='obDeptEtc'){ob.dept=t.value;obSync();}
    if(t.id==='obNick'){ob.nick=t.value;ob.nickOk=false;const m=$('#nickMsg');m.className='msg';m.textContent='확인하는 중…';obSync();clearTimeout(nickT);
      nickT=setTimeout(async()=>{const n=ob.nick.trim();const {data,error}=await sb.rpc('ul_nick_ok',{p_nick:n});if(n!==ob.nick.trim())return;
        ob.nickOk=data==='ok';ob.nickMsg=error?'확인하지 못했어요: '+errText(error):ob.nickOk?'쓸 수 있는 닉네임이에요':data;
        const m2=$('#nickMsg');if(m2){m2.className='msg '+(ob.nickOk?'ok':'bad');m2.textContent=ob.nickMsg;}obSync();},350);}
  });
}
async function kakaoLogin(){const {error}=await sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+location.pathname}});if(error)toast('로그인을 시작하지 못했어요: '+errText(error));}

function fatal(msg){$('#boot').innerHTML=`<div class="boot-in"><span class="boot-logo">${LOGO}</span><b>유니로그</b><p style="color:var(--sub);font-size:13.5px;max-width:300px;text-align:center;margin:6px 0 0">${msg}</p><button class="btn line" type="button" onclick="location.reload()" style="width:auto;margin-top:12px">다시 시도</button></div>`;$('#boot').hidden=false;}
/* 방문 기록 · 지금 접속 중 (관리자 통계용, 개인정보 없이 기기별 무작위 번호만 써요) */
function visitorId(){let v=store.get('ul_vid');if(!v||v.length<8){v='v'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set('ul_vid',v);}return v;}
function startPresence(uid){
  try{const id=visitorId();
    Promise.resolve(sb.rpc('ul_ping',{p_vid:id})).catch(()=>{});
    if(!sb.channel)return;
    const ch=sb.channel('ul-online',{config:{presence:{key:id}}});
    ch.subscribe(st=>{if(st==='SUBSCRIBED')ch.track({t:Date.now(),u:uid?1:0});});
    S.presence=ch;
  }catch(e){}
}
async function boot(){
  if(!sb){fatal('config.js의 Supabase 주소와 키를 확인해 주세요.');return;}
  bindOb();
  const {data:{session}}=await sb.auth.getSession();
  startPresence(session&&session.user.id);
  if(!session){ob.step=0;obRender();return;}
  S.uid=session.user.id;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.replace(location.origin+location.pathname);});
  await route();
}
async function route(){
  const {data:me,error}=await sb.from('ul_profiles').select('*').eq('id',S.uid).maybeSingle();
  if(error){fatal(/ul_profiles|relation|schema cache/.test(error.message)?'데이터베이스 설정이 아직 안 됐어요. Supabase에서 1_unilog_schema.sql을 실행해 주세요.':'정보를 불러오지 못했어요: '+esc(errText(error)));return;}
  if(!me){ob.step=1;obRender();return;}
  S.me=me;U[S.uid]=me;
  if(me.status==='banned'){
    if(me.banned_until&&new Date(me.banned_until)<=new Date()){const {data:st}=await sb.rpc('ul_lift_my_ban');if(st&&st!=='banned')return route();}
    ob.banTitle=me.banned_until?new Date(me.banned_until).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})+'까지 이용이 정지됐어요':'이용이 정지됐어요';
    ob.banSub=(me.reject_reason?'사유: '+me.reject_reason+'. ':'')+'문의가 있으면 운영자에게 연락해 주세요.';ob.step='banned';obRender();return;}
  $('#ob').hidden=true;
  if(!S.entered)return enterApp();
  renderBar();renderMe();
}
function renderBar(){
  const b=$('#pendingBar'),st=S.me&&S.me.status;
  if(st==='pending'){b.innerHTML='재학생 인증을 확인하고 있어요. 그동안에도 리뷰와 글을 쓸 수 있어요.';b.hidden=false;}
  else if(st==='rejected'){b.innerHTML=`재학생 인증이 반려됐어요${S.me.reject_reason?' · '+esc(S.me.reject_reason):''} <button type="button" data-verify-start>다시 인증하기 ›</button>`;b.hidden=false;}
  else b.hidden=true;
}
async function enterApp(){
  S.entered=true;
  S.school=SCHOOLS.find(x=>x.id===S.me.school_id)||{id:S.me.school_id,n:S.me.school_name,short:S.me.school_short,campus:S.me.campus,cityDisp:''};
  $('#boot').hidden=true;$('#app').hidden=false;renderBar();

  renderWhere();renderList();renderTalk();renderPeople();renderMe();
  sb.from('ul_private').select('*').eq('id',S.uid).maybeSingle().then(({data})=>{S.priv=data;});
  const [pl,bm]=await Promise.all([sb.from('ul_post_likes').select('post_id').eq('user_id',S.uid),sb.from('ul_post_bookmarks').select('post_id').eq('user_id',S.uid)]);
  S.likedPost=new Set((pl.data||[]).map(x=>x.post_id));S.bmPost=new Set((bm.data||[]).map(x=>x.post_id));
  loadCounts();loadNotis();loadTalk();loadRanking();

  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadNotis();});
  try{await loadKakao();S.ps=new kakao.maps.services.Places();S.coord=await schoolCoord();await loadPlaces();renderMeTabs();}
  catch(e){S.placesState='error';
    S.placesErr=e.message==='NO_KEY'?'config.js에 카카오 JavaScript 키(KAKAO_JS_KEY)를 넣어야 주변 가게를 불러올 수 있어요.'
      :e.message==='LOAD'?'카카오맵을 불러오지 못했어요. 카카오 개발자 콘솔 → 앱 → 플랫폼 → Web에 이 사이트 주소가 등록돼 있는지, 카카오맵 사용 설정이 켜져 있는지 확인해 주세요.'
      :'가게를 불러오지 못했어요: '+esc(errText(e));renderList();}
}

$('#locBtn').onclick=locateMe;
document.addEventListener('click',e=>{if(e.target.closest('[data-verify-start]'))startVerify();});
$('#mapBtn').onclick=e=>{S.mapOn=!S.mapOn;e.currentTarget.setAttribute('aria-pressed',S.mapOn);if(S.mapOn&&!window.kakao){toast('지도를 아직 불러오지 못했어요');}renderMap();};
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.searchHit=null;S.listShow=10;if(S.tab!=='near')setTab('near');renderList();renderMap();});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=S.q.trim();$('#q').blur();if(q&&!filtered().length)searchMore(q);});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#sheet,#psheet,#nsheet,#pesheet,#rsheet,#ob'))return;
  if(t.closest('[data-pedit]'))return openPE();
  if(t.closest('[data-noti]'))return openNoti();
  const mt=t.closest('[data-metab]');if(mt){S.meTab=S.meTab===mt.dataset.metab?null:mt.dataset.metab;renderMeTabs();return;}
  const mm=t.closest('[data-memore]');if(mm){const k='more_'+mm.dataset.memore;S.meCache[k]=!S.meCache[k];renderMeBody();return;}
  const op=t.closest('[data-openplace]');if(op)return openPlaceById(op.dataset.openplace);
  const tc=t.closest('[data-tcat]');if(tc){S.talk.cat=tc.dataset.tcat;S.talk.page=1;loadTalk();return;}
  const tp=t.closest('[data-tpage]');if(tp&&!tp.disabled){S.talk.page=+tp.dataset.tpage;loadTalk();$('#v-talk').scrollIntoView({block:'start'});return;}
  const po=t.closest('[data-post]');if(po)return openPost(+po.dataset.post);
  if(t.closest('[data-pwrite]'))return openWrite();
  if(t.closest('[data-listmore]')){S.listShow+=10;renderList();return;}
  if(t.closest('[data-searchmore]'))return searchMore(S.q.trim());
  if(t.closest('[data-rankmore]')){S.rank.show+=10;renderPeople();return;}
  if(t.closest('[data-rankless]')){S.rank.show=10;renderPeople();$('#v-people').scrollIntoView();return;}
  const pd=t.closest('[data-period]');if(pd){S.rank.period=pd.dataset.period;S.rank.show=10;S.rank.loaded=false;renderPeople();loadRanking();return;}
  const g=t.closest('[data-genre]');if(g){S.genre=g.dataset.genre||null;if(!g.dataset.genre)S.tag=null;S.listShow=10;renderFilters();renderList();renderMap();return;}
  const tg=t.closest('[data-tag]');if(tg){S.tag=S.tag===tg.dataset.tag?null:tg.dataset.tag;S.listShow=10;renderFilters();renderList();renderMap();return;}
  const o=t.closest('[data-open]');if(o)return openSheet(o.dataset.open);
});
[['#scrim',closeSheet],['#pscrim',closePost],['#nscrim',()=>$('#nscrim').hidden=true],['#pescrim',()=>$('#pescrim').hidden=true],['#rscrim',()=>$('#rscrim').hidden=true]]
  .forEach(([id,fn])=>$(id).addEventListener('click',e=>{if(e.target===$(id))fn();}));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#lb').hidden){$('#lb').hidden=true;return;}
  for(const id of ['#rscrim','#pescrim','#nscrim','#pscrim','#scrim'])if(!$(id).hidden){id==='#scrim'?closeSheet():id==='#pscrim'?closePost():$(id).hidden=true;return;}});
boot();

/* =====================================================================
   관리자: 다른 학교 둘러보기 (맛집 · 리뷰 · 로그톡 · 랭킹)
   ===================================================================== */
let swq='',swr='전체';
function isOtherSchool(){return !!(S.school&&S.me&&S.school.id!==S.me.school_id);}
function openSchoolSwitch(){if(!S.isAdmin)return;swq='';renderSwitch();$('#swscrim').hidden=false;}
function swList(){
  const q=swq.trim(),L=SCHOOLS.filter(x=>(swr==='전체'||x.r===swr)&&(!q||x.n.includes(q)||x.short.includes(q)||x.campus.includes(q)||x.cityDisp.includes(q)));
  return L.length?L.map(x=>`<button class="opt" type="button" data-sw="${x.id}" aria-pressed="${S.school.id===x.id}"><span><b>${esc(x.n)}${x.id===S.me.school_id?' · 내 학교':''}</b><span>${x.campus?esc(x.campus)+' · ':''}${esc(x.cityDisp)}</span></span><span class="ck">✓</span></button>`).join('')
    :'<div class="empty">찾는 학교가 없어요.</div>';
}
function renderSwitch(){
  const sh=$('#swsheet');
  sh.innerHTML=`<div class="gut pe-wrap" style="gap:10px">
    <div class="nhead"><h3>학교 둘러보기</h3><span><button class="x" type="button" data-swclose aria-label="닫기">×</button></span></div>
    <p class="hint" style="margin:0;font-size:12.5px;color:var(--sub)">관리자에게만 보이는 기능이에요. 고른 학교의 주변 맛집, 리뷰, 로그톡, 리뷰어 랭킹을 볼 수 있어요. 로그톡 글쓰기는 내 학교에서만 돼요.</p>
    <div class="fld" style="margin:0"><input id="swq" type="search" placeholder="학교 이름이나 지역 검색" value="${esc(swq)}" autocomplete="off" aria-label="학교 검색"></div>
    <div class="genre" role="group" aria-label="지역">${REGIONS.map(r=>`<button type="button" data-swr="${r}" aria-pressed="${swr===r}">${r}</button>`).join('')}</div>
    <div class="opts school-box" id="swList">${swList()}</div></div>`;
  sh.querySelector('[data-swclose]').onclick=()=>$('#swscrim').hidden=true;
  sh.querySelector('#swq').oninput=e=>{swq=e.target.value;$('#swList').innerHTML=swList();};
  sh.querySelectorAll('[data-swr]').forEach(b=>b.onclick=()=>{swr=b.dataset.swr;sh.querySelectorAll('[data-swr]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#swList').innerHTML=swList();});
  $('#swList').onclick=e=>{const b=e.target.closest('[data-sw]');if(b)switchSchool(b.dataset.sw);};
}
async function switchSchool(id){
  $('#swscrim').hidden=true;
  if(!S.school||S.school.id===id)return;
  const own=id===S.me.school_id;
  const sc=own?(SCHOOLS.find(x=>x.id===id)||{id:S.me.school_id,n:S.me.school_name,short:S.me.school_short,campus:S.me.campus,cityDisp:''}):SCHOOLS.find(x=>x.id===id);
  if(!sc)return;
  S.school=sc;S.places=[];S.placeMap={};S.searchHit=null;S.listShow=10;S.q='';const qi=$('#q');if(qi)qi.value='';
  S.talk={cat:'전체',page:1,total:0,list:[]};S.rank={period:S.rank.period,show:10,list:[],loaded:false};
  if(S.overlays)S.overlays.forEach(o=>o.setMap(null));S.overlays=[];
  renderWhere();renderTalk();renderPeople();loadTalk();loadRanking();
  setTab('near');
  toast(own?'내 학교로 돌아왔어요':`${sc.short}${sc.campus?' '+sc.campus:''} 둘러보는 중이에요`);
  if(!window.kakao||!S.ps){renderList();return;}
  try{S.coord=await schoolCoord();if(S.kmap){S.kmap.setCenter(new kakao.maps.LatLng(S.coord.y,S.coord.x));}await loadPlaces();}
  catch(e){S.placesState='error';S.placesErr='가게를 불러오지 못했어요: '+esc(errText(e));renderList();}
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-school-switch]'))return openSchoolSwitch();
  if(e.target.closest('[data-school-home]'))return switchSchool(S.me.school_id);
});
$('#swscrim').addEventListener('click',e=>{if(e.target===$('#swscrim'))$('#swscrim').hidden=true;});

</script>
